<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>VR Room - Natural Grab + Reachable Radius</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- movement-controls for keyboard, touch and VR thumbsticks -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <!-- Blink teleport -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #020202;
    }

    #vignette {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;

      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0) 50%,
        rgba(5, 8, 5, 0.5) 100%
      );
    }

    #soundButton {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1000;

      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 8px;

      color: white;
      background: rgba(0, 0, 0, 0.82);

      font: 600 15px Arial, sans-serif;
      cursor: pointer;
    }

    #soundButton:disabled {
      opacity: 0.7;
      cursor: default;
    }

    #debugHud {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      max-width: 320px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 8px;
      color: #9fffb0;
      background: rgba(0,0,0,0.82);
      font: 13px monospace;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="vignette"></div>
  <button id="soundButton" type="button" onclick="enableSound()">
    ENABLE SOUND
  </button>

  <!--
    DEBUG HUD: desktop-only overlay. The in-headset version is the
    a-text entity attached to the camera further down (id=debugHudVR)
    — this div does NOT show up inside an active VR session, WebXR
    fullscreen only renders the 3D canvas. Remove both once grabbing
    is confirmed working well.
  -->
  <div id="debugHud">Debug HUD ready.</div>

  <!--
    Native browser audio is used here because it is more reliable
    on the Quest browser than waiting for an A-Frame sound component
    to initialise.
  -->
  <audio
    id="fanAudio"
    src="sounds/73347__noisecollector__noisy_ceiling_fan.mp3"
    preload="auto"
    loop
    playsinline>
  </audio>

  <audio
    id="bedroomRainAudio"
    src="sounds/bedroom-rain.wav"
    preload="auto"
    loop
    playsinline>
  </audio>

  <audio
    id="fluorescentAudio"
    src="sounds/fluorescent-light.wav"
    preload="auto"
    loop
    playsinline>
  </audio>

  <audio
    id="tvStaticAudio"
    src="sounds/tv-static.mp3"
    preload="auto"
    loop
    playsinline>
  </audio>

  <audio
    id="footstepAudio"
    src="sounds/842186__aardsreal__footstep-floor.wav"
    preload="auto"
    loop
    playsinline>
  </audio>

  <script>
    /* ============================================================
       RELIABLE SOUND BUTTON

       The button updates immediately, before any audio loading.
       All play() calls begin during the same real button click,
       which is important because browsers block automatic sound.
    ============================================================ */
    async function enableSound() {
      const button =
        document.querySelector('#soundButton');

      if (!button) {
        return;
      }

      button.textContent = 'STARTING SOUND...';
      button.disabled = true;

      const tracks = [
        {
          element: document.querySelector('#fanAudio'),
          volume: 0.28
        },
        {
          element: document.querySelector('#bedroomRainAudio'),
          volume: 0.22
        },
        {
          element: document.querySelector('#fluorescentAudio'),
          volume: 0.18
        },
        {
          element: document.querySelector('#tvStaticAudio'),
          volume: 0.08
        }
      ];

      const playPromises = tracks.map(({ element, volume }) => {
        if (!element) {
          return Promise.reject(
            new Error('A sound element is missing.')
          );
        }

        element.volume = volume;

        return element.play();
      });

      const results =
        await Promise.allSettled(playPromises);

      const successful =
        results.filter(
          result => result.status === 'fulfilled'
        ).length;

      results.forEach((result, index) => {
        if (result.status === 'rejected') {
          console.error(
            'Sound failed:',
            tracks[index].element
              ? tracks[index].element.src
              : 'missing audio element',
            result.reason
          );
        }
      });

      const scene =
        document.querySelector('a-scene');

      if (successful > 0) {
        if (scene) {
          scene.audioUnlocked = true;
        }

        button.textContent = 'SOUND ENABLED';

        window.setTimeout(() => {
          button.style.display = 'none';
        }, 1200);

        console.log(
          `${successful} ambience sound file(s) started.`
        );
      } else {
        button.textContent = 'TRY SOUND AGAIN';
        button.disabled = false;

        console.error(
          'No sound file could start. Check the Network and Console tabs.'
        );
      }
    }

    window.enableSound = enableSound;

    /* ============================================================
       SHARED DEBUG HUD WRITER

       Updates both the desktop overlay div and the in-headset text
       panel attached to the camera, so the same message is readable
       on a computer or inside the Quest.
    ============================================================ */
    function updateDebugHud(message) {
      const div = document.querySelector('#debugHud');
      if (div) {
        div.textContent = message;
      }

      const vrPanel = document.querySelector('#debugHudVR');
      if (vrPanel) {
        vrPanel.setAttribute('text', 'value', message);
      }
    }

    window.updateDebugHud = updateDebugHud;

    /* ============================================================
       1. FLICKERING LIGHTS
    ============================================================ */
    AFRAME.registerComponent('flicker', {
      schema: {
        min: { default: 0.8 },
        max: { default: 1.2 },
        speed: { default: 0.5 }
      },

      init: function () {
        this.seed = Math.random() * 1000;
      },

      tick: function (timeMs) {
        const time =
          (timeMs * 0.001 * this.data.speed) +
          this.seed;

        const noise = (
          Math.sin(time * 6.1) +
          Math.sin(time * 2.3) +
          Math.sin(time * 11.7)
        ) / 3;

        const intensity =
          this.data.min +
          ((noise + 1) / 2) *
          (this.data.max - this.data.min);

        this.el.setAttribute(
          'light',
          'intensity',
          intensity
        );
      }
    });


    /* ============================================================
       2. MODEL LOAD STATUS
    ============================================================ */
    AFRAME.registerComponent('model-status', {
      schema: {
        name: { default: '3D model' }
      },

      init: function () {
        this.el.addEventListener('model-loaded', () => {
          console.log(
            `${this.data.name} loaded successfully.`
          );
        });

        this.el.addEventListener('model-error', (event) => {
          console.error(
            `${this.data.name} failed to load.`,
            event.detail
          );
        });
      }
    });


    /* ============================================================
       3. CREATE TELEPORT FLOORS FROM NAMED BLENDER OBJECTS
    ============================================================ */
    AFRAME.registerComponent('tag-floors', {
      schema: {
        floorNames: {
          type: 'array',

          default: [
            'san nha phong khach',
            'san nha phong an',
            'san nha TOILET',
            'san giat do',
            'SAN PHONG NGU'
          ]
        }
      },

      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');

          if (!root) {
            return;
          }

          root.updateMatrixWorld(true);

          let container =
            document.querySelector('#generated-teleport-floors');

          if (!container) {
            container = document.createElement('a-entity');
            container.setAttribute(
              'id',
              'generated-teleport-floors'
            );
            this.el.sceneEl.appendChild(container);
          }

          this.data.floorNames.forEach((name) => {
            const object = root.getObjectByName(name);

            if (!object) {
              return;
            }

            object.updateMatrixWorld(true);

            const box =
              new THREE.Box3().setFromObject(object);

            if (box.isEmpty()) {
              return;
            }

            const size = new THREE.Vector3();
            const center = new THREE.Vector3();

            box.getSize(size);
            box.getCenter(center);

            const plane = document.createElement('a-plane');

            plane.setAttribute('class', 'floor');
            plane.setAttribute('rotation', '-90 0 0');

            plane.setAttribute(
              'width',
              Math.max(size.x, 0.1)
            );

            plane.setAttribute(
              'height',
              Math.max(size.z, 0.1)
            );

            plane.setAttribute(
              'position',
              `${center.x} ${box.min.y + 0.02} ${center.z}`
            );

            plane.setAttribute(
              'material',
              'opacity: 0; transparent: true; depthWrite: false'
            );

            container.appendChild(plane);
          });
        });
      }
    });


    /* ============================================================
       4. DESKTOP HEAD BOB
    ============================================================ */
    AFRAME.registerComponent('head-bob', {
      schema: {
        amount: { default: 0.025 },
        speed: { default: 11 }
      },

      init: function () {
        this.baseY = this.el.object3D.position.y;
        this.time = 0;

        this.previousPosition = new THREE.Vector3();
        this.currentPosition = new THREE.Vector3();

        this.el.object3D.getWorldPosition(
          this.previousPosition
        );
      },

      tick: function (time, deltaTime) {
        if (this.el.sceneEl.is('vr-mode')) {
          return;
        }

        this.el.object3D.getWorldPosition(
          this.currentPosition
        );

        const deltaX =
          this.currentPosition.x -
          this.previousPosition.x;

        const deltaZ =
          this.currentPosition.z -
          this.previousPosition.z;

        const distance = Math.sqrt(
          (deltaX * deltaX) +
          (deltaZ * deltaZ)
        );

        if (
          distance > 0.001 &&
          distance < 0.5
        ) {
          this.time +=
            deltaTime *
            0.001 *
            this.data.speed;

          this.el.object3D.position.y =
            this.baseY +
            Math.sin(this.time) *
            this.data.amount;
        } else {
          this.el.object3D.position.y =
            THREE.MathUtils.lerp(
              this.el.object3D.position.y,
              this.baseY,
              0.1
            );
        }

        this.previousPosition.copy(
          this.currentPosition
        );
      }
    });


    /* ============================================================
       5. DOOR OPEN / CLOSE
    ============================================================ */
    AFRAME.registerComponent('door-hinge', {
      schema: {
        openAngle: { default: 45 },

        hingeSide: {
          default: 'left',
          oneOf: ['left', 'right']
        },

        speed: { default: 7 },

        direction: { default: 1 }
      },

      init: function () {
        this.isOpen = false;
        this.currentAngle = 0;
        this.targetAngle = 0;
        this.pivot = null;
        this.lastActivation = 0;

        this.activate =
          this.activate.bind(this);

        this.el.addEventListener(
          'model-loaded',
          () => this.createRealHinge()
        );

        this.el.addEventListener(
          'activate-object',
          this.activate
        );

        this.el.addEventListener(
          'click',
          (event) => {
            if (this.el.sceneEl.is('vr-mode')) {
              return;
            }

            if (event && event.stopPropagation) {
              event.stopPropagation();
            }

            this.activate();
          }
        );
      },

      getLocalBoundingBox: function (model) {
        const localBox = new THREE.Box3();
        localBox.makeEmpty();

        this.el.object3D.updateMatrixWorld(true);
        model.updateMatrixWorld(true);

        const inverseEntityWorld =
          new THREE.Matrix4()
            .copy(this.el.object3D.matrixWorld)
            .invert();

        model.traverse((node) => {
          if (!node.isMesh || !node.geometry) {
            return;
          }

          if (!node.geometry.boundingBox) {
            node.geometry.computeBoundingBox();
          }

          if (!node.geometry.boundingBox) {
            return;
          }

          const nodeToEntity =
            new THREE.Matrix4().multiplyMatrices(
              inverseEntityWorld,
              node.matrixWorld
            );

          const nodeBox =
            node.geometry.boundingBox
              .clone()
              .applyMatrix4(nodeToEntity);

          localBox.union(nodeBox);
        });

        return localBox;
      },

      createRealHinge: function () {
        const model =
          this.el.getObject3D('mesh');

        if (!model || this.pivot) {
          return;
        }

        this.el.object3D.updateMatrixWorld(true);
        model.updateMatrixWorld(true);

        const box =
          this.getLocalBoundingBox(model);

        if (box.isEmpty()) {
          return;
        }

        const size = new THREE.Vector3();
        const center = new THREE.Vector3();

        box.getSize(size);
        box.getCenter(center);

        const widthRunsAlongX =
          size.x >= size.z;

        const hingePosition =
          center.clone();

        if (widthRunsAlongX) {
          hingePosition.x =
            this.data.hingeSide === 'left'
              ? box.min.x
              : box.max.x;
        } else {
          hingePosition.z =
            this.data.hingeSide === 'left'
              ? box.min.z
              : box.max.z;
        }

        const pivot =
          new THREE.Group();

        pivot.name =
          'real-door-edge-hinge';

        pivot.position.copy(
          hingePosition
        );

        model.updateMatrix();

        const oldLocalMatrix =
          model.matrix.clone();

        this.el.object3D.add(pivot);
        this.el.object3D.remove(model);
        pivot.add(model);

        const inversePivotMatrix =
          new THREE.Matrix4().makeTranslation(
            -hingePosition.x,
            -hingePosition.y,
            -hingePosition.z
          );

        const modelInsidePivot =
          new THREE.Matrix4().multiplyMatrices(
            inversePivotMatrix,
            oldLocalMatrix
          );

        modelInsidePivot.decompose(
          model.position,
          model.quaternion,
          model.scale
        );

        model.updateMatrix();
        model.updateMatrixWorld(true);

        this.pivot = pivot;

        console.log(
          'Real door hinge created:',
          this.data.hingeSide,
          'edge stays fixed.'
        );
      },

      activate: function () {
        const now =
          performance.now();

        if (
          now - this.lastActivation <
          450
        ) {
          return;
        }

        this.lastActivation = now;
        this.isOpen = !this.isOpen;

        const degrees =
          this.isOpen
            ? this.data.openAngle *
              this.data.direction
            : 0;

        this.targetAngle =
          THREE.MathUtils.degToRad(
            degrees
          );

        console.log(
          this.isOpen
            ? 'Door opening.'
            : 'Door closing.'
        );
      },

      tick: function (time, deltaTime) {
        if (
          !this.pivot ||
          !deltaTime
        ) {
          return;
        }

        const amount =
          Math.min(
            1,
            (deltaTime / 1000) *
            this.data.speed
          );

        this.currentAngle =
          THREE.MathUtils.lerp(
            this.currentAngle,
            this.targetAngle,
            amount
          );

        this.pivot.rotation.y =
          this.currentAngle;
      }
    });


    /* ============================================================
       6. NATURAL GRABBABLE (proximity-based, VR game style)

       Desktop: click to pick up, click again to drop.
       VR: move the hand near the item and hold grip.
    ============================================================ */
    AFRAME.registerComponent('natural-grabbable', {
      schema: {
        gravity: { default: -9.8 },
        floorY: { default: 0.015 },
        throwMultiplier: { default: 1.0 },
        maxThrowSpeed: { default: 6 }
      },

      init: function () {
        this.heldBy = null;
        this.velocity = new THREE.Vector3();
        this.isMoving = false;
        this.lastSurfaceCheck = 0;

        this.dropRay = new THREE.Raycaster();
        this.dropRay.far = 2.5;

        this.el.addEventListener('click', () => {
          if (this.el.sceneEl.is('vr-mode')) {
            return;
          }

          const desktopHold =
            document.querySelector('#desktopHold');

          if (!desktopHold) {
            return;
          }

          if (this.heldBy) {
            this.release(
              new THREE.Vector3()
            );
          } else {
            this.grab(desktopHold);
          }
        });
      },

      getWorldBox: function () {
        const model =
          this.el.getObject3D('mesh') ||
          this.el.object3D;

        model.updateMatrixWorld(true);

        return new THREE.Box3().setFromObject(
          model
        );
      },

      distanceToPoint: function (worldPoint) {
        const box = this.getWorldBox();

        if (box.isEmpty()) {
          return Infinity;
        }

        const closest =
          worldPoint.clone().clamp(
            box.min,
            box.max
          );

        return closest.distanceTo(
          worldPoint
        );
      },

      reparentPreserveWorld: function (newParent) {
        const object =
          this.el.object3D;

        object.updateMatrixWorld(true);

        const worldMatrix =
          object.matrixWorld.clone();

        newParent.object3D.updateMatrixWorld(true);

        newParent.appendChild(this.el);

        const inverseParentWorld =
          new THREE.Matrix4()
            .copy(newParent.object3D.matrixWorld)
            .invert();

        const localMatrix =
          new THREE.Matrix4().multiplyMatrices(
            inverseParentWorld,
            worldMatrix
          );

        localMatrix.decompose(
          object.position,
          object.quaternion,
          object.scale
        );

        object.updateMatrix();
        object.updateMatrixWorld(true);
      },

      grab: function (handEntity) {
        if (this.heldBy) {
          return false;
        }

        this.isMoving = false;
        this.velocity.set(0, 0, 0);
        this.heldBy = handEntity;

        this.reparentPreserveWorld(
          handEntity
        );

        this.el.addState('grabbed');

        console.log(
          this.el.id,
          'grabbed by',
          handEntity.id
        );

        return true;
      },

      release: function (controllerVelocity) {
        if (!this.heldBy) {
          return;
        }

        const scene =
          this.el.sceneEl;

        this.reparentPreserveWorld(scene);

        this.heldBy = null;
        this.el.removeState('grabbed');

        this.velocity.copy(
          controllerVelocity ||
          new THREE.Vector3()
        );

        this.velocity.multiplyScalar(
          this.data.throwMultiplier
        );

        this.velocity.clampLength(
          0,
          this.data.maxThrowSpeed
        );

        if (this.velocity.length() < 0.22) {
          const settled =
            this.settleOnNearbySurface(0.45);

          this.isMoving = !settled;
        } else {
          this.isMoving = true;
        }

        console.log(
          this.el.id,
          'released at speed',
          this.velocity.length().toFixed(2)
        );
      },

      getRoomMeshes: function () {
        const meshes = [];

        this.el.sceneEl
          .querySelectorAll('.roompart')
          .forEach((entity) => {
            const root =
              entity.getObject3D('mesh');

            if (!root) {
              return;
            }

            root.updateMatrixWorld(true);

            root.traverse((node) => {
              if (node.isMesh) {
                meshes.push(node);
              }
            });
          });

        return meshes;
      },

      settleOnNearbySurface: function (maximumDistance) {
        const roomMeshes =
          this.getRoomMeshes();

        if (!roomMeshes.length) {
          return false;
        }

        const box =
          this.getWorldBox();

        if (box.isEmpty()) {
          return false;
        }

        const center =
          new THREE.Vector3();

        box.getCenter(center);

        const origin =
          new THREE.Vector3(
            center.x,
            box.min.y + 0.08,
            center.z
          );

        this.dropRay.set(
          origin,
          new THREE.Vector3(0, -1, 0)
        );

        this.dropRay.far =
          maximumDistance + 0.08;

        const hit =
          this.dropRay.intersectObjects(
            roomMeshes,
            true
          )[0];

        if (!hit) {
          return false;
        }

        const gap =
          box.min.y - hit.point.y;

        if (
          gap < -0.03 ||
          gap > maximumDistance
        ) {
          return false;
        }

        this.el.object3D.position.y +=
          hit.point.y -
          box.min.y +
          0.012;

        this.velocity.set(0, 0, 0);
        return true;
      },

      tick: function (time, deltaTime) {
        if (
          this.heldBy ||
          !this.isMoving ||
          !deltaTime
        ) {
          return;
        }

        const dt =
          Math.min(
            deltaTime / 1000,
            0.04
          );

        this.velocity.y +=
          this.data.gravity * dt;

        this.el.object3D.position.addScaledVector(
          this.velocity,
          dt
        );

        const damping =
          Math.pow(0.985, dt * 60);

        this.velocity.x *= damping;
        this.velocity.z *= damping;

        this.el.object3D.updateMatrixWorld(true);

        const box =
          this.getWorldBox();

        if (!box.isEmpty()) {
          const floorPenetration =
            this.data.floorY -
            box.min.y;

          if (floorPenetration > 0) {
            this.el.object3D.position.y +=
              floorPenetration;

            if (
              Math.abs(this.velocity.y) >
              0.8
            ) {
              this.velocity.y *= -0.12;
              this.velocity.x *= 0.72;
              this.velocity.z *= 0.72;
            } else {
              this.velocity.set(0, 0, 0);
              this.isMoving = false;
            }
          }
        }

        if (
          this.isMoving &&
          this.velocity.y <= 0 &&
          time - this.lastSurfaceCheck > 120
        ) {
          this.lastSurfaceCheck = time;

          if (
            this.settleOnNearbySurface(0.12)
          ) {
            this.isMoving = false;
          }
        }
      }
    });


    /* ============================================================
       NATURAL VR HAND GRAB

       FIX: radius increased from 0.24 (about fist-sized reach,
       very easy to be "just barely" out of range without realizing
       it) to 0.4 — closer to how most VR games size their grab
       zone, so the item grabs reliably once your hand visually
       overlaps or nearly touches it.

       Also now writes a live "distance to nearest grabbable" line
       to the debug HUD every frame, so you can literally watch the
       number and see whether you're in range before pressing grip
       — no more guessing blind.
    ============================================================ */
    AFRAME.registerComponent('natural-grab-hand', {
      schema: {
        radius: { default: 0.4 },
        velocitySmoothing: { default: 0.35 }
      },

      init: function () {
        this.heldItem = null;

        this.previousPosition =
          new THREE.Vector3();

        this.currentPosition =
          new THREE.Vector3();

        this.smoothedVelocity =
          new THREE.Vector3();

        this.instantVelocity =
          new THREE.Vector3();

        this.hasPreviousPosition = false;
        this.lastHudUpdate = 0;

        this.el.addEventListener(
          'gripdown',
          () => this.grabNearest()
        );

        this.el.addEventListener(
          'gripup',
          () => this.releaseHeld()
        );

        this.el.addEventListener(
          'controllerdisconnected',
          () => this.releaseHeld()
        );
      },

      findNearest: function () {
        const handPosition =
          new THREE.Vector3();

        this.el.object3D.getWorldPosition(
          handPosition
        );

        let nearest = null;
        let nearestEl = null;
        let nearestDistance = Infinity;

        this.el.sceneEl
          .querySelectorAll(
            '[natural-grabbable]'
          )
          .forEach((entity) => {
            const component =
              entity.components[
                'natural-grabbable'
              ];

            if (
              !component ||
              component.heldBy
            ) {
              return;
            }

            const distance =
              component.distanceToPoint(
                handPosition
              );

            if (distance < nearestDistance) {
              nearest = component;
              nearestEl = entity;
              nearestDistance = distance;
            }
          });

        return { nearest, nearestEl, nearestDistance };
      },

      grabNearest: function () {
        if (this.heldItem) {
          return;
        }

        const { nearest, nearestEl, nearestDistance } =
          this.findNearest();

        if (!nearest || nearestDistance > this.data.radius) {
          console.log(
            this.el.id,
            'grip pressed, but no item was close enough. Nearest was',
            nearestEl ? nearestEl.id : 'none',
            'at',
            isFinite(nearestDistance) ? nearestDistance.toFixed(2) + 'm' : 'n/a'
          );

          if (window.updateDebugHud) {
            window.updateDebugHud(
              'Grip pressed, out of range. Nearest: ' +
              (nearestEl ? nearestEl.id : 'none') +
              ' at ' +
              (isFinite(nearestDistance) ? nearestDistance.toFixed(2) + 'm' : 'n/a') +
              ' (need <= ' + this.data.radius + 'm)'
            );
          }

          return;
        }

        if (nearest.grab(this.el)) {
          this.heldItem = nearest;

          if (window.updateDebugHud) {
            window.updateDebugHud(
              'Grabbed: ' + (nearestEl ? nearestEl.id : 'item')
            );
          }
        }
      },

      releaseHeld: function () {
        if (!this.heldItem) {
          return;
        }

        const released =
          this.heldItem;

        this.heldItem = null;

        released.release(
          this.smoothedVelocity.clone()
        );

        if (window.updateDebugHud) {
          window.updateDebugHud('Released item.');
        }
      },

      tick: function (time, deltaTime) {
        if (!deltaTime) {
          return;
        }

        this.el.object3D.getWorldPosition(
          this.currentPosition
        );

        if (!this.hasPreviousPosition) {
          this.previousPosition.copy(
            this.currentPosition
          );

          this.hasPreviousPosition = true;
          return;
        }

        const seconds =
          deltaTime / 1000;

        if (seconds > 0) {
          this.instantVelocity
            .subVectors(
              this.currentPosition,
              this.previousPosition
            )
            .divideScalar(seconds);

          this.smoothedVelocity.lerp(
            this.instantVelocity,
            this.data.velocitySmoothing
          );

          this.previousPosition.copy(
            this.currentPosition
          );
        }

        /*
          Live "distance to nearest grabbable" readout, throttled to
          ~6 times per second so it doesn't spam querySelectorAll
          every single frame.
        */
        if (!this.heldItem && time - this.lastHudUpdate > 150) {
          this.lastHudUpdate = time;

          const { nearestEl, nearestDistance } =
            this.findNearest();

          if (window.updateDebugHud) {
            if (nearestEl) {
              const inRange = nearestDistance <= this.data.radius;
              window.updateDebugHud(
                (inRange ? '[IN RANGE] ' : '') +
                'Nearest to ' + this.el.id + ': ' + nearestEl.id +
                ' @ ' + nearestDistance.toFixed(2) + 'm (grip range ' +
                this.data.radius + 'm)'
              );
            } else {
              window.updateDebugHud('No grabbable items found in scene.');
            }
          }
        }
      }
    });


    /* ============================================================
       RIGHT TRIGGER: DOOR ONLY

       FIX: raycaster objects widened from ".door" to ".door, .item"
       so the teddy/hairpin's mouseenter/mouseleave hover animations
       actually fire again in VR (they need something raycasting at
       them to trigger). useDoor() still only reacts to elements
       that resolve to a door-hinge component, so widening this list
       doesn't cause the trigger to accidentally grab items — grip
       proximity still owns grabbing, trigger still only opens/closes
       the door.
    ============================================================ */
    AFRAME.registerComponent('vr-door-interactor', {
      init: function () {
        this.triggerHeld = false;

        this.el.addEventListener(
          'triggerdown',
          (event) => {
            if (event && event.stopPropagation) {
              event.stopPropagation();
            }

            if (this.triggerHeld) {
              return;
            }

            this.triggerHeld = true;
            this.useDoor();
          }
        );

        this.el.addEventListener(
          'triggerup',
          () => {
            this.triggerHeld = false;
          }
        );
      },

      useDoor: function () {
        const raycaster =
          this.el.components.raycaster;

        if (!raycaster) {
          return;
        }

        if (raycaster.refreshObjects) {
          raycaster.refreshObjects();
        }

        const intersections =
          raycaster.intersections || [];

        let hitElement = null;

        if (
          intersections.length > 0 &&
          intersections[0].object
        ) {
          hitElement =
            intersections[0].object.el || null;
        }

        if (
          !hitElement &&
          raycaster.intersectedEls &&
          raycaster.intersectedEls.length
        ) {
          hitElement =
            raycaster.intersectedEls[0];
        }

        let current = hitElement;

        while (
          current &&
          current !== this.el.sceneEl
        ) {
          if (
            current.components &&
            current.components['door-hinge']
          ) {
            current.emit(
              'activate-object',
              {},
              false
            );
            return;
          }

          current = current.parentElement;
        }
      }
    });


    /* ============================================================
       8. AUDIO UNLOCK
    ============================================================ */


    /* ============================================================
       9. FOOTSTEPS
    ============================================================ */
    AFRAME.registerComponent('footstep-player', {
      schema: {
        minSpeed: { default: 0.02 },
        maxSpeed: { default: 4 }
      },

      init: function () {
        this.previousPosition =
          this.el.object3D.position.clone();

        this.audio =
          document.querySelector('#footstepAudio');

        this.isPlaying = false;

        if (this.audio) {
          this.audio.volume = 0.5;
        }
      },

      tick: function (time, deltaTime) {
        if (
          !deltaTime ||
          !this.audio
        ) {
          return;
        }

        const currentPosition =
          this.el.object3D.position;

        const deltaX =
          currentPosition.x -
          this.previousPosition.x;

        const deltaZ =
          currentPosition.z -
          this.previousPosition.z;

        const distance =
          Math.sqrt(
            (deltaX * deltaX) +
            (deltaZ * deltaZ)
          );

        const speed =
          distance /
          (deltaTime / 1000);

        const isWalking =
          speed >= this.data.minSpeed &&
          speed <= this.data.maxSpeed;

        const audioUnlocked =
          this.el.sceneEl.audioUnlocked;

        if (
          isWalking &&
          audioUnlocked &&
          !this.isPlaying
        ) {
          const playPromise =
            this.audio.play();

          if (playPromise) {
            playPromise.catch((error) => {
              console.error(
                'Footstep sound failed:',
                error
              );
            });
          }

          this.isPlaying = true;
        } else if (
          (!isWalking ||
           !audioUnlocked) &&
          this.isPlaying
        ) {
          this.audio.pause();
          this.audio.currentTime = 0;
          this.isPlaying = false;
        }

        this.previousPosition.copy(
          currentPosition
        );
      }
    });
  </script>


  <a-scene

    background="
      color: #020202"

    fog="
      type: exponential;
      color: #050805;
      density: 0.025"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true"

    loading-screen="
      enabled: true;
      dotsColor: white;
      backgroundColor: black"

    webxr="
      optionalFeatures:
        local-floor,
        bounded-floor">


    <!-- ======================================================
         LIGHTS
    ======================================================= -->
    <a-light
      type="ambient"
      color="#1c261c"
      intensity="0.6">
    </a-light>


    <a-entity
      position="-3.5 2.6 -1"

      light="
        type: point;
        color: #7cb860;
        intensity: 7;
        distance: 12;
        decay: 2;
        castShadow: false"

      flicker="
        min: 5.5;
        max: 7.5;
        speed: 0.3">
    </a-entity>


    <a-entity
      position="2.5 2.6 1.5"

      light="
        type: point;
        color: #ffdb59;
        intensity: 8;
        distance: 15;
        decay: 2;
        castShadow: false"

      flicker="
        min: 6.5;
        max: 8.5;
        speed: 0.2">
    </a-entity>


    <!-- ======================================================
         SPLIT ROOM MODELS
    ======================================================= -->
    <a-entity
      id="wallandground"
      class="roompart"
      gltf-model="url(wallandground.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Walls and ground">
    </a-entity>


    <a-entity
      id="living"
      class="roompart"
      gltf-model="url(livingasset.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Living room">
    </a-entity>


    <a-entity
      id="kitchen"
      class="roompart"
      gltf-model="url(kitchenasset.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Kitchen">
    </a-entity>


    <a-entity
      id="bedroom"
      class="roompart"
      gltf-model="url(bedroomasset.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Bedroom">
    </a-entity>


    <a-entity
      id="toilet"
      class="roompart"
      gltf-model="url(toiletasset.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Toilet">
    </a-entity>


    <a-entity
      id="bantho"
      class="roompart"
      gltf-model="url(bantho.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Ban tho">
    </a-entity>


    <!-- ======================================================
         FALLBACK TELEPORT FLOOR
    ======================================================= -->
    <a-plane
      id="fallback-teleport-floor"
      class="floor"

      position="0 0.01 0"
      rotation="-90 0 0"

      width="30"
      height="30"

      material="
        opacity: 0;
        transparent: true;
        depthWrite: false">
    </a-plane>


    <!-- ======================================================
         INTERACTIVE DOOR
    ======================================================= -->
    <a-entity
      id="door"
      class="door interactable"

      gltf-model="url(cua.glb)"

      position="0 0 0"
      rotation="0 0 0"

      door-hinge="
        openAngle: 45;
        hingeSide: left;
        direction: 1;
        speed: 7"

      model-status="name: Door">
    </a-entity>


    <!-- ======================================================
         INTERACTIVE TEDDY
    ======================================================= -->
    <a-entity
      id="teddy"
      class="item interactable"

      gltf-model="url(teddy.glb)"

      position="1 0.6 -2"

      natural-grabbable

      model-status="name: Teddy bear"

      animation__hoverin="
        property: scale;
        to: 1.1 1.1 1.1;
        startEvents: mouseenter;
        dur: 200"

      animation__hoverout="
        property: scale;
        to: 1 1 1;
        startEvents: mouseleave;
        dur: 200">
    </a-entity>


    <!-- ======================================================
         INTERACTIVE HAIRPIN
    ======================================================= -->
    <a-entity
      id="hairpin"
      class="item interactable"

      gltf-model="url(hairpin.glb)"

      position="1.5 0.6 -2"

      natural-grabbable

      model-status="name: Hairpin"

      animation__hoverin="
        property: scale;
        to: 1.2 1.2 1.2;
        startEvents: mouseenter;
        dur: 200"

      animation__hoverout="
        property: scale;
        to: 1 1 1;
        startEvents: mouseleave;
        dur: 200">
    </a-entity>


    <!-- ======================================================
         PLAYER RIG
    ======================================================= -->
    <a-entity
      id="rig"

      position="1 0 0.5"

      movement-controls="
        speed: 0.15;
        controls: gamepad, keyboard, touch;
        fly: false"


      footstep-player="
        minSpeed: 0.02;
        maxSpeed: 4">


      <!-- Camera -->
      <a-entity
        id="cam"

        camera="
          near: 0.01;
          fov: 60"

        position="0 1.6 0"

        look-controls

        head-bob="
          amount: 0.025;
          speed: 11">


        <!-- Desktop object-holding point -->
        <a-entity
          id="desktopHold"
          position="0 -0.25 -1">
        </a-entity>


        <!-- IN-HEADSET DEBUG PANEL
             Shows live grab-range distance and trigger/grip results
             directly inside the headset. Delete this entity (and
             the #debugHud div in the body, and updateDebugHud calls)
             once everything is confirmed working well. -->
        <a-entity
          id="debugHudVR"
          position="0 -0.25 -0.6"
          text="
            value: Debug HUD ready.;
            color: #9fffb0;
            align: center;
            width: 1;
            wrapCount: 28;
            baseline: center">
        </a-entity>


        <!-- Desktop cursor -->
        <a-cursor
          color="#ffffff"
          scale="0.7 0.7 0.7"

          cursor="
            rayOrigin: entity;
            fuse: false"

          raycaster="
            objects: .interactable;
            far: 6;
            interval: 50">
        </a-cursor>

      </a-entity>


      <!-- Left controller: teleport + natural grab -->
      <a-entity
        id="leftHand"

        hand-controls="
          hand: left"

        blink-controls="
          cameraRig: #rig;
          teleportOrigin: #cam;
          collisionEntities: .floor;
          button: trigger;
          snapTurn: false;
          rotateOnTeleport: false"

        natural-grab-hand="
          radius: 0.4;
          velocitySmoothing: 0.35">
      </a-entity>


      <!-- Right controller: door trigger + natural grab

           FIX: raycaster objects widened to ".door, .item" so
           hover animations work on items again; grab radius raised
           to 0.4 to match the left hand. -->
      <a-entity
        id="rightHand"

        hand-controls="
          hand: right"

        raycaster="
          objects: .door, .item;
          far: 6;
          interval: 50;
          showLine: true;
          lineColor: #ffffff;
          lineOpacity: 0.8"

        natural-grab-hand="
          radius: 0.4;
          velocitySmoothing: 0.35"

        vr-door-interactor>

      </a-entity>

    </a-entity>

  </a-scene>
