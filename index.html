<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>VR Room - Stable Quest Version + Fixed Interactions</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- movement-controls for keyboard, touch and VR thumbsticks -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <!-- Blink teleport -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #020202;
    }

    #vignette {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;

      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0) 50%,
        rgba(5, 8, 5, 0.5) 100%
      );
    }

    #soundButton {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1000;

      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 8px;

      color: white;
      background: rgba(0, 0, 0, 0.82);

      font: 600 15px Arial, sans-serif;
      cursor: pointer;
    }

    #soundButton:disabled {
      opacity: 0.7;
      cursor: default;
    }
  </style>
</head>

<body>
  <div id="vignette"></div>
  <button id="soundButton" type="button" onclick="enableSound()">
    ENABLE SOUND
  </button>

  <!--
    Native browser audio is used here because it is more reliable
    on the Quest browser than waiting for an A-Frame sound component
    to initialise.
  -->
  <audio
    id="fanAudio"
    src="sounds/73347__noisecollector__noisy_ceiling_fan.mp3"
    preload="auto"
    loop
    playsinline>
  </audio>

  <audio
    id="bedroomRainAudio"
    src="sounds/bedroom-rain.wav"
    preload="auto"
    loop
    playsinline>
  </audio>

  <audio
    id="fluorescentAudio"
    src="sounds/fluorescent-light.wav"
    preload="auto"
    loop
    playsinline>
  </audio>

  <audio
    id="tvStaticAudio"
    src="sounds/tv-static.mp3"
    preload="auto"
    loop
    playsinline>
  </audio>

  <audio
    id="footstepAudio"
    src="sounds/842186__aardsreal__footstep-floor.wav"
    preload="auto"
    loop
    playsinline>
  </audio>

  <script>
    /* ============================================================
       RELIABLE SOUND BUTTON
    ============================================================ */
    async function enableSound() {
      const button =
        document.querySelector('#soundButton');

      if (!button) {
        return;
      }

      button.textContent = 'STARTING SOUND...';
      button.disabled = true;

      const tracks = [
        {
          element: document.querySelector('#fanAudio'),
          volume: 0.28
        },
        {
          element: document.querySelector('#bedroomRainAudio'),
          volume: 0.22
        },
        {
          element: document.querySelector('#fluorescentAudio'),
          volume: 0.18
        },
        {
          element: document.querySelector('#tvStaticAudio'),
          volume: 0.08
        }
      ];

      const playPromises = tracks.map(({ element, volume }) => {
        if (!element) {
          return Promise.reject(
            new Error('A sound element is missing.')
          );
        }

        element.volume = volume;

        return element.play();
      });

      const results =
        await Promise.allSettled(playPromises);

      const successful =
        results.filter(
          result => result.status === 'fulfilled'
        ).length;

      results.forEach((result, index) => {
        if (result.status === 'rejected') {
          console.error(
            'Sound failed:',
            tracks[index].element
              ? tracks[index].element.src
              : 'missing audio element',
            result.reason
          );
        }
      });

      const scene =
        document.querySelector('a-scene');

      if (successful > 0) {
        if (scene) {
          scene.audioUnlocked = true;
        }

        button.textContent = 'SOUND ENABLED';

        window.setTimeout(() => {
          button.style.display = 'none';
        }, 1200);

        console.log(
          `${successful} ambience sound file(s) started.`
        );
      } else {
        button.textContent = 'TRY SOUND AGAIN';
        button.disabled = false;

        console.error(
          'No sound file could start. Check the Network and Console tabs.'
        );
      }
    }

    window.enableSound = enableSound;

    /* ============================================================
       1. FLICKERING LIGHTS
    ============================================================ */
    AFRAME.registerComponent('flicker', {
      schema: {
        min: { default: 0.8 },
        max: { default: 1.2 },
        speed: { default: 0.5 }
      },

      init: function () {
        this.seed = Math.random() * 1000;
      },

      tick: function (timeMs) {
        const time =
          (timeMs * 0.001 * this.data.speed) +
          this.seed;

        const noise = (
          Math.sin(time * 6.1) +
          Math.sin(time * 2.3) +
          Math.sin(time * 11.7)
        ) / 3;

        const intensity =
          this.data.min +
          ((noise + 1) / 2) *
          (this.data.max - this.data.min);

        this.el.setAttribute(
          'light',
          'intensity',
          intensity
        );
      }
    });


    /* ============================================================
       2. MODEL LOAD STATUS
    ============================================================ */
    AFRAME.registerComponent('model-status', {
      schema: {
        name: { default: '3D model' }
      },

      init: function () {
        this.el.addEventListener('model-loaded', () => {
          console.log(
            `${this.data.name} loaded successfully.`
          );
        });

        this.el.addEventListener('model-error', (event) => {
          console.error(
            `${this.data.name} failed to load.`,
            event.detail
          );
        });
      }
    });


    /* ============================================================
       3. CREATE TELEPORT FLOORS FROM NAMED BLENDER OBJECTS
    ============================================================ */
    AFRAME.registerComponent('tag-floors', {
      schema: {
        floorNames: {
          type: 'array',

          default: [
            'san nha phong khach',
            'san nha phong an',
            'san nha TOILET',
            'san giat do',
            'SAN PHONG NGU'
          ]
        }
      },

      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');

          if (!root) {
            return;
          }

          root.updateMatrixWorld(true);

          let container =
            document.querySelector('#generated-teleport-floors');

          if (!container) {
            container = document.createElement('a-entity');
            container.setAttribute(
              'id',
              'generated-teleport-floors'
            );
            this.el.sceneEl.appendChild(container);
          }

          this.data.floorNames.forEach((name) => {
            const object = root.getObjectByName(name);

            if (!object) {
              return;
            }

            object.updateMatrixWorld(true);

            const box =
              new THREE.Box3().setFromObject(object);

            if (box.isEmpty()) {
              return;
            }

            const size = new THREE.Vector3();
            const center = new THREE.Vector3();

            box.getSize(size);
            box.getCenter(center);

            const plane = document.createElement('a-plane');

            plane.setAttribute('class', 'floor');
            plane.setAttribute('rotation', '-90 0 0');

            plane.setAttribute(
              'width',
              Math.max(size.x, 0.1)
            );

            plane.setAttribute(
              'height',
              Math.max(size.z, 0.1)
            );

            plane.setAttribute(
              'position',
              `${center.x} ${box.min.y + 0.02} ${center.z}`
            );

            plane.setAttribute(
              'material',
              'opacity: 0; transparent: true; depthWrite: false'
            );

            container.appendChild(plane);
          });
        });
      }
    });


    /* ============================================================
       4. DESKTOP HEAD BOB
    ============================================================ */
    AFRAME.registerComponent('head-bob', {
      schema: {
        amount: { default: 0.025 },
        speed: { default: 11 }
      },

      init: function () {
        this.baseY = this.el.object3D.position.y;
        this.time = 0;

        this.previousPosition = new THREE.Vector3();
        this.currentPosition = new THREE.Vector3();

        this.el.object3D.getWorldPosition(
          this.previousPosition
        );
      },

      tick: function (time, deltaTime) {
        if (this.el.sceneEl.is('vr-mode')) {
          return;
        }

        this.el.object3D.getWorldPosition(
          this.currentPosition
        );

        const deltaX =
          this.currentPosition.x -
          this.previousPosition.x;

        const deltaZ =
          this.currentPosition.z -
          this.previousPosition.z;

        const distance = Math.sqrt(
          (deltaX * deltaX) +
          (deltaZ * deltaZ)
        );

        if (
          distance > 0.001 &&
          distance < 0.5
        ) {
          this.time +=
            deltaTime *
            0.001 *
            this.data.speed;

          this.el.object3D.position.y =
            this.baseY +
            Math.sin(this.time) *
            this.data.amount;
        } else {
          this.el.object3D.position.y =
            THREE.MathUtils.lerp(
              this.el.object3D.position.y,
              this.baseY,
              0.1
            );
        }

        this.previousPosition.copy(
          this.currentPosition
        );
      }
    });


    /* ============================================================
       5. DOOR OPEN / CLOSE

       FIX #1: previously used a continuous per-frame lerp that
       chases the target angle forever. That asymptotically slows
       down near the end and is sensitive to frame-rate stutters.
       Now uses a fixed-duration eased swing (elapsed / duration,
       not frame-count dependent) so it always finishes in exactly
       `duration` ms.

       FIX #2 (looks like the whole door rotates instead of one
       edge staying fixed): the hinge point was auto-guessed from
       the door's bounding box (assuming the wider horizontal
       dimension is the door's width). If your door mesh's own
       local axes don't line up with that guess, the pivot lands
       in the wrong place and it can look like the door spins
       around its center instead of swinging on an edge.

       Two ways to fix this now:
       1. Set axis="x" or axis="z" explicitly (instead of "auto")
          if you know which world axis the door's width runs
          along, and hingeSide to pick which end is the hinge.
       2. Set debug="true" — this drops a small red sphere at the
          exact point the code thinks the hinge is. Load the scene,
          look at where that sphere sits relative to the door: if
          it's not sitting right on the visible hinge edge of your
          door model, that confirms the auto-guess is wrong and
          tells you which way to correct axis/hingeSide.
    ============================================================ */
    AFRAME.registerComponent('door-hinge', {
      schema: {
        openAngle: { default: 45 },
        hingeSide: {
          default: 'left',
          oneOf: ['left', 'right']
        },
        axis: {
          default: 'auto',
          oneOf: ['auto', 'x', 'z']
        },
        duration: { default: 600 },
        debug: { default: false }
      },

      init: function () {
        this.isOpen = false;
        this.startAngle = 0;
        this.currentAngle = 0;
        this.targetAngle = 0;
        this.animStartTime = 0;
        this.pivot = null;
        this.lastActivation = 0;

        this.activate =
          this.activate.bind(this);

        this.el.addEventListener(
          'model-loaded',
          () => this.createHinge()
        );

        this.el.addEventListener(
          'click',
          this.activate
        );

        this.el.addEventListener(
          'vr-activate',
          this.activate
        );
      },

      createHinge: function () {
        const model =
          this.el.getObject3D('mesh');

        if (!model || this.pivot) {
          return;
        }

        this.el.object3D.updateMatrixWorld(true);
        model.updateMatrixWorld(true);

        const box =
          new THREE.Box3().setFromObject(model);

        if (box.isEmpty()) {
          return;
        }

        const size = new THREE.Vector3();
        const center = new THREE.Vector3();

        box.getSize(size);
        box.getCenter(center);

        const useXAxis =
          this.data.axis === 'auto'
            ? size.x >= size.z
            : this.data.axis === 'x';

        const hingeWorld =
          center.clone();

        if (useXAxis) {
          hingeWorld.x =
            this.data.hingeSide === 'left'
              ? box.min.x
              : box.max.x;
        } else {
          hingeWorld.z =
            this.data.hingeSide === 'left'
              ? box.min.z
              : box.max.z;
        }

        const hingeLocal =
          this.el.object3D.worldToLocal(
            hingeWorld.clone()
          );

        const pivot =
          new THREE.Group();

        pivot.name = 'automatic-door-hinge';
        pivot.position.copy(hingeLocal);

        this.el.object3D.add(pivot);

        pivot.attach(model);

        this.pivot = pivot;

        if (this.data.debug) {
          const marker = document.createElement('a-sphere');
          marker.setAttribute('radius', '0.04');
          marker.setAttribute('color', '#ff2222');
          marker.setAttribute('position', `${hingeWorld.x} ${hingeWorld.y} ${hingeWorld.z}`);
          this.el.sceneEl.appendChild(marker);
          console.log('Door hinge marker placed at world position:', hingeWorld);
        }

        console.log(
          'Door hinge created on',
          this.data.hingeSide,
          'side, axis:', useXAxis ? 'x' : 'z'
        );
      },

      easeInOutQuad: function (t) {
        return t < 0.5
          ? 2 * t * t
          : 1 - Math.pow(-2 * t + 2, 2) / 2;
      },

      activate: function () {
        const now = performance.now();

        if (now - this.lastActivation < 250) {
          return;
        }

        this.lastActivation = now;
        this.isOpen = !this.isOpen;

        this.startAngle = this.currentAngle;
        this.animStartTime = now;

        this.targetAngle =
          THREE.MathUtils.degToRad(
            this.isOpen
              ? this.data.openAngle
              : 0
          );
      },

      tick: function () {
        if (!this.pivot) {
          return;
        }

        const elapsed = performance.now() - this.animStartTime;
        const t = Math.min(1, elapsed / this.data.duration);
        const eased = this.easeInOutQuad(t);

        this.currentAngle =
          THREE.MathUtils.lerp(
            this.startAngle,
            this.targetAngle,
            eased
          );

        this.pivot.rotation.y =
          this.currentAngle;
      }
    });


    /* ============================================================
       INVISIBLE INTERACTION HITBOX
    ============================================================ */
    AFRAME.registerComponent('easy-target', {
      schema: {
        padding: { default: 0.08 }
      },

      init: function () {
        this.el.addEventListener(
          'model-loaded',
          () => this.createHitbox()
        );
      },

      createHitbox: function () {
        if (
          this.el.querySelector(
            '.interaction-hitbox'
          )
        ) {
          return;
        }

        const model =
          this.el.getObject3D('mesh');

        if (!model) {
          return;
        }

        this.el.object3D.updateMatrixWorld(true);
        model.updateMatrixWorld(true);

        const box =
          new THREE.Box3().setFromObject(model);

        if (box.isEmpty()) {
          return;
        }

        const size = new THREE.Vector3();
        const center = new THREE.Vector3();

        box.getSize(size);
        box.getCenter(center);

        const localCenter =
          this.el.object3D.worldToLocal(
            center.clone()
          );

        const padding =
          this.data.padding;

        const hitbox =
          document.createElement('a-box');

        hitbox.setAttribute(
          'class',
          'interaction-hitbox'
        );

        hitbox.setAttribute(
          'position',
          `${localCenter.x} ${localCenter.y} ${localCenter.z}`
        );

        hitbox.setAttribute(
          'width',
          Math.max(size.x + padding, 0.12)
        );

        hitbox.setAttribute(
          'height',
          Math.max(size.y + padding, 0.12)
        );

        hitbox.setAttribute(
          'depth',
          Math.max(size.z + padding, 0.12)
        );

        hitbox.setAttribute(
          'material',
          'color: #ffffff; opacity: 0.001; transparent: true; depthWrite: false'
        );

        this.el.appendChild(hitbox);
      }
    });


    /* ============================================================
       6. GRAB AND DROP TEDDY / HAIRPIN
    ============================================================ */
    AFRAME.registerComponent('grabbable', {
      init: function () {
        this.isGrabbed = false;
        this.lastActivation = 0;

        this.dropRay =
          new THREE.Raycaster();

        this.dropRay.far = 8;

        this.activate =
          this.activate.bind(this);

        this.el.addEventListener(
          'click',
          this.activate
        );

        this.el.addEventListener(
          'vr-activate',
          this.activate
        );
      },

      activate: function () {
        const now = performance.now();

        if (now - this.lastActivation < 250) {
          return;
        }

        this.lastActivation = now;

        if (this.isGrabbed) {
          this.drop();
        } else {
          this.grab();
        }
      },

      grab: function () {
        const scene =
          this.el.sceneEl;

        if (
          scene.heldItem &&
          scene.heldItem !== this
        ) {
          return;
        }

        const holder =
          scene.is('vr-mode')
            ? document.querySelector('#rightHand')
            : document.querySelector('#cam');

        if (!holder) {
          console.error(
            'Cannot grab object: holder was not found.'
          );
          return;
        }

        this.isGrabbed = true;
        scene.heldItem = this;

        holder.object3D.attach(
          this.el.object3D
        );

        if (scene.is('vr-mode')) {
          this.el.object3D.position.set(
            0,
            -0.03,
            -0.28
          );
        } else {
          this.el.object3D.position.set(
            0,
            -0.25,
            -1
          );
        }

        console.log(
          this.el.id,
          'picked up.'
        );
      },

      drop: function () {
        if (!this.isGrabbed) {
          return;
        }

        const scene =
          this.el.sceneEl;

        const worldPosition =
          new THREE.Vector3();

        this.el.object3D.getWorldPosition(
          worldPosition
        );

        scene.object3D.attach(
          this.el.object3D
        );

        this.isGrabbed = false;
        scene.heldItem = null;

        const roomMeshes = [];

        scene
          .querySelectorAll('.roompart')
          .forEach((entity) => {
            const root =
              entity.getObject3D('mesh');

            if (!root) {
              return;
            }

            root.updateMatrixWorld(true);

            root.traverse((node) => {
              if (node.isMesh) {
                roomMeshes.push(node);
              }
            });
          });

        if (roomMeshes.length) {
          this.dropRay.set(
            new THREE.Vector3(
              worldPosition.x,
              worldPosition.y + 1.5,
              worldPosition.z
            ),

            new THREE.Vector3(
              0,
              -1,
              0
            )
          );

          const hit =
            this.dropRay.intersectObjects(
              roomMeshes,
              true
            )[0];

          if (hit) {
            this.el.object3D.updateMatrixWorld(true);

            const objectBox =
              new THREE.Box3().setFromObject(
                this.el.object3D
              );

            const lift =
              hit.point.y -
              objectBox.min.y +
              0.015;

            this.el.object3D.position.y +=
              lift;
          }
        }

        console.log(
          this.el.id,
          'dropped.'
        );
      }
    });


    /* ============================================================
       RELIABLE RIGHT-CONTROLLER INTERACTION

       FIX: this used to read this.el.components.raycaster.intersectedEls
       — the raycaster component's own cached hit list, which only
       refreshes every `interval` ms (50ms) on its own timer. If a
       trigger press landed in between refreshes, or right after the
       hand moved, that list could be empty or stale even while
       visibly pointing at the teddy — causing grabs to silently
       fail with no error.

       Now useTrigger() does its own fresh raycast at the exact
       moment the trigger fires, straight from the controller's
       current world position/direction against the actual meshes
       of every ".interactable" entity (including their invisible
       easy-target hitboxes). No dependency on any other
       component's internal timing.
    ============================================================ */
    AFRAME.registerComponent('vr-interactor', {
      init: function () {
        this.raycaster = new THREE.Raycaster();
        this.raycaster.far = 6;

        this.el.addEventListener(
          'triggerdown',
          () => this.useTrigger()
        );

        this.el.addEventListener(
          'gripdown',
          () => this.dropHeldItem()
        );
      },

      useTrigger: function () {
        const scene =
          this.el.sceneEl;

        if (scene.heldItem) {
          scene.heldItem.drop();
          return;
        }

        const origin = new THREE.Vector3();
        const direction = new THREE.Vector3();

        this.el.object3D.getWorldPosition(origin);
        this.el.object3D.getWorldDirection(direction);

        const meshes = [];

        scene.querySelectorAll('.interactable').forEach((entity) => {
          const tagMesh = (root) => {
            if (!root) return;
            root.updateMatrixWorld(true);
            root.traverse((node) => {
              if (node.isMesh) {
                node.userData.__interactableEl = entity;
                meshes.push(node);
              }
            });
          };

          tagMesh(entity.getObject3D('mesh'));

          const hitboxEl = entity.querySelector('.interaction-hitbox');
          if (hitboxEl && hitboxEl.object3D) {
            tagMesh(hitboxEl.object3D);
          }
        });

        if (!meshes.length) {
          return;
        }

        this.raycaster.set(origin, direction);
        const hit = this.raycaster.intersectObjects(meshes, true)[0];

        if (!hit) {
          return;
        }

        let node = hit.object;
        while (node && !node.userData.__interactableEl) {
          node = node.parent;
        }

        const target = node ? node.userData.__interactableEl : null;

        if (target) {
          target.emit(
            'vr-activate',
            {},
            false
          );
        }
      },

      dropHeldItem: function () {
        const heldItem =
          this.el.sceneEl.heldItem;

        if (heldItem) {
          heldItem.drop();
        }
      }
    });


    /* ============================================================
       9. FOOTSTEPS
    ============================================================ */
    AFRAME.registerComponent('footstep-player', {
      schema: {
        minSpeed: { default: 0.02 },
        maxSpeed: { default: 4 }
      },

      init: function () {
        this.previousPosition =
          this.el.object3D.position.clone();

        this.audio =
          document.querySelector('#footstepAudio');

        this.isPlaying = false;

        if (this.audio) {
          this.audio.volume = 0.5;
        }
      },

      tick: function (time, deltaTime) {
        if (
          !deltaTime ||
          !this.audio
        ) {
          return;
        }

        const currentPosition =
          this.el.object3D.position;

        const deltaX =
          currentPosition.x -
          this.previousPosition.x;

        const deltaZ =
          currentPosition.z -
          this.previousPosition.z;

        const distance =
          Math.sqrt(
            (deltaX * deltaX) +
            (deltaZ * deltaZ)
          );

        const speed =
          distance /
          (deltaTime / 1000);

        const isWalking =
          speed >= this.data.minSpeed &&
          speed <= this.data.maxSpeed;

        const audioUnlocked =
          this.el.sceneEl.audioUnlocked;

        if (
          isWalking &&
          audioUnlocked &&
          !this.isPlaying
        ) {
          const playPromise =
            this.audio.play();

          if (playPromise) {
            playPromise.catch((error) => {
              console.error(
                'Footstep sound failed:',
                error
              );
            });
          }

          this.isPlaying = true;
        } else if (
          (!isWalking ||
           !audioUnlocked) &&
          this.isPlaying
        ) {
          this.audio.pause();
          this.audio.currentTime = 0;
          this.isPlaying = false;
        }

        this.previousPosition.copy(
          currentPosition
        );
      }
    });
  </script>


  <a-scene

    background="
      color: #020202"

    fog="
      type: exponential;
      color: #050805;
      density: 0.025"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true"

    loading-screen="
      enabled: true;
      dotsColor: white;
      backgroundColor: black"

    webxr="
      optionalFeatures:
        local-floor,
        bounded-floor">


    <!-- ======================================================
         LIGHTS
    ======================================================= -->
    <a-light
      type="ambient"
      color="#1c261c"
      intensity="0.6">
    </a-light>


    <a-entity
      position="-3.5 2.6 -1"

      light="
        type: point;
        color: #7cb860;
        intensity: 7;
        distance: 12;
        decay: 2;
        castShadow: false"

      flicker="
        min: 5.5;
        max: 7.5;
        speed: 0.3">
    </a-entity>


    <a-entity
      position="2.5 2.6 1.5"

      light="
        type: point;
        color: #ffdb59;
        intensity: 8;
        distance: 15;
        decay: 2;
        castShadow: false"

      flicker="
        min: 6.5;
        max: 8.5;
        speed: 0.2">
    </a-entity>


    <!-- ======================================================
         SPLIT ROOM MODELS
    ======================================================= -->
    <a-entity
      id="wallandground"
      class="roompart"
      gltf-model="url(wallandground.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Walls and ground">
    </a-entity>


    <a-entity
      id="living"
      class="roompart"
      gltf-model="url(livingasset.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Living room">
    </a-entity>


    <a-entity
      id="kitchen"
      class="roompart"
      gltf-model="url(kitchenasset.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Kitchen">
    </a-entity>


    <a-entity
      id="bedroom"
      class="roompart"
      gltf-model="url(bedroomasset.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Bedroom">
    </a-entity>


    <a-entity
      id="toilet"
      class="roompart"
      gltf-model="url(toiletasset.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Toilet">
    </a-entity>


    <a-entity
      id="bantho"
      class="roompart"
      gltf-model="url(bantho.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Ban tho">
    </a-entity>


    <!-- ======================================================
         FALLBACK TELEPORT FLOOR
    ======================================================= -->
    <a-plane
      id="fallback-teleport-floor"
      class="floor"

      position="0 0.01 0"
      rotation="-90 0 0"

      width="30"
      height="30"

      material="
        opacity: 0;
        transparent: true;
        depthWrite: false">
    </a-plane>


    <!-- ======================================================
         INTERACTIVE DOOR
    ======================================================= -->
    <a-entity
      id="door"
      class="door interactable"

      gltf-model="url(cua.glb)"

      position="0 0 0"
      rotation="0 0 0"

      door-hinge="
        openAngle: 45;
        hingeSide: left;
        axis: auto;
        duration: 600;
        debug: true"

      easy-target="
        padding: 0.06"

      model-status="name: Door">
    </a-entity>


    <!-- ======================================================
         INTERACTIVE TEDDY
    ======================================================= -->
    <a-entity
      id="teddy"
      class="item interactable"

      gltf-model="url(teddy.glb)"

      position="1 0.6 -2"

      grabbable

      easy-target="
        padding: 0.12"

      model-status="name: Teddy bear"

      animation__hoverin="
        property: scale;
        to: 1.1 1.1 1.1;
        startEvents: mouseenter;
        dur: 200"

      animation__hoverout="
        property: scale;
        to: 1 1 1;
        startEvents: mouseleave;
        dur: 200">
    </a-entity>


    <!-- ======================================================
         INTERACTIVE HAIRPIN
    ======================================================= -->
    <a-entity
      id="hairpin"
      class="item interactable"

      gltf-model="url(hairpin.glb)"

      position="1.5 0.6 -2"

      grabbable

      easy-target="
        padding: 0.16"

      model-status="name: Hairpin"

      animation__hoverin="
        property: scale;
        to: 1.2 1.2 1.2;
        startEvents: mouseenter;
        dur: 200"

      animation__hoverout="
        property: scale;
        to: 1 1 1;
        startEvents: mouseleave;
        dur: 200">
    </a-entity>


    <!-- ======================================================
         PLAYER RIG
    ======================================================= -->
    <a-entity
      id="rig"

      position="1 0 0.5"

      movement-controls="
        speed: 0.15;
        controls: gamepad, keyboard, touch;
        fly: false"


      footstep-player="
        minSpeed: 0.02;
        maxSpeed: 4">


      <!-- Camera -->
      <a-entity
        id="cam"

        camera="
          near: 0.01;
          fov: 60"

        position="0 1.6 0"

        look-controls

        head-bob="
          amount: 0.025;
          speed: 11">


        <!-- Desktop cursor -->
        <a-cursor
          color="#ffffff"
          scale="0.7 0.7 0.7"

          cursor="
            rayOrigin: entity;
            fuse: false"

          raycaster="
            objects: .interactable;
            far: 6;
            interval: 50">
        </a-cursor>

      </a-entity>


      <!-- Left controller: teleport -->
      <a-entity
        id="leftHand"

        hand-controls="
          hand: left"

        blink-controls="
          cameraRig: #rig;
          teleportOrigin: #cam;
          collisionEntities: .floor;
          button: trigger;
          snapTurn: false;
          rotateOnTeleport: false">
      </a-entity>


      <!-- Right controller: interact
           FIX: laser-controls removed. It was setting up its own
           internal raycaster/cursor system, which fights with (and
           can overwrite) the explicit raycaster config below that
           vr-interactor depends on. That conflict is very likely
           why the teddy/hairpin wouldn't grab. hand-controls still
           gives us the physical controller model + trigger/grip
           events; raycaster + vr-interactor handle all pointing and
           interaction now, with nothing else touching the same
           raycaster component. -->
      <a-entity
        id="rightHand"

        hand-controls="
          hand: right"

        raycaster="
          objects: .interactable;
          far: 6;
          interval: 50;
          showLine: true;
          lineColor: #ffffff;
          lineOpacity: 0.8"

        vr-interactor>
      </a-entity>

    </a-entity>

  </a-scene>
</body>
</html>
