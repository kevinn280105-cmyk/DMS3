<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>VR Room - Split Assets + Sound</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    body { margin: 0; }

    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0) 50%,
        rgba(5,8,5,0.5) 100%
      );
    }
  </style>
</head>

<body>

  <div id="vignette"></div>

  <script>
    /* ============================================================
       DEBUG SWITCH
    ============================================================ */
    const DEBUG_LOG_MESH_NAMES = true;


    /* ============================================================
       Component 1: flicker
    ============================================================ */
    AFRAME.registerComponent('flicker', {
      schema: {
        min: { default: 0.8 },
        max: { default: 1.2 },
        speed: { default: 0.5 }
      },

      init: function () {
        this.seed = Math.random() * 1000;
      },

      tick: function (t) {
        const time = (t * 0.001 * this.data.speed) + this.seed;
        const noise = (
          Math.sin(time * 6.1) +
          Math.sin(time * 2.3) +
          Math.sin(time * 11.7)
        ) / 3;

        this.el.setAttribute(
          'light',
          'intensity',
          this.data.min +
          ((noise + 1) / 2) *
          (this.data.max - this.data.min)
        );
      }
    });


    /* ============================================================
       Component 2: tag-floors
    ============================================================ */
    AFRAME.registerComponent('tag-floors', {
      schema: {
        floorNames: {
          default: [
            'san nha phong khach',
            'san nha phoing an',
            'san nha TOILET',
            'san giat do',
            'SAN PHONG NGU'
          ]
        }
      },

      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');
          if (!root) return;

          if (DEBUG_LOG_MESH_NAMES) {
            console.log('--- Mesh names in', this.el.id, '---');

            root.traverse((node) => {
              if (node.name) {
                console.log('  ', node.name);
              }
            });
          }

          const floorContainer = document.createElement('a-entity');

          floorContainer.setAttribute(
            'id',
            'floor-colliders-' + this.el.id
          );

          this.el.sceneEl.appendChild(floorContainer);

          let foundAny = false;

          this.data.floorNames.forEach((name) => {
            const object = root.getObjectByName(name);
            if (!object) return;

            foundAny = true;

            const box = new THREE.Box3().setFromObject(object);
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();

            box.getSize(size);
            box.getCenter(center);

            const plane = document.createElement('a-plane');

            plane.setAttribute('class', 'floor');
            plane.setAttribute('rotation', '-90 0 0');
            plane.setAttribute('width', Math.max(size.x, 0.1));
            plane.setAttribute('height', Math.max(size.z, 0.1));

            plane.setAttribute(
              'position',
              `${center.x} ${box.min.y + 0.02} ${center.z}`
            );

            plane.setAttribute('visible', 'false');
            plane.setAttribute('data-floor-name', name);

            floorContainer.appendChild(plane);
          });

          if (!foundAny) {
            const box = new THREE.Box3().setFromObject(root);

            if (!box.isEmpty()) {
              const size = new THREE.Vector3();
              const center = new THREE.Vector3();

              box.getSize(size);
              box.getCenter(center);

              const plane = document.createElement('a-plane');

              plane.setAttribute('class', 'floor');
              plane.setAttribute('rotation', '-90 0 0');
              plane.setAttribute('width', Math.max(size.x, 0.1));
              plane.setAttribute('height', Math.max(size.z, 0.1));

              plane.setAttribute(
                'position',
                `${center.x} ${box.min.y + 0.02} ${center.z}`
              );

              plane.setAttribute('visible', 'false');

              plane.setAttribute(
                'data-floor-name',
                'fallback-' + this.el.id
              );

              floorContainer.appendChild(plane);

              if (DEBUG_LOG_MESH_NAMES) {
                console.log(
                  this.el.id,
                  ': no named floor matched — created fallback floor from bounding box.'
                );
              }
            }
          }
        });
      }
    });


    /* ============================================================
       Component 3: tag-colliders
    ============================================================ */
    AFRAME.registerComponent('tag-colliders', {
      schema: {
        objectKeys: {
          default: ['table', 'chair', 'door']
        }
      },

      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');
          if (!root) return;

          root.updateMatrixWorld(true);

          const colliderContainer = document.createElement('a-entity');

          colliderContainer.setAttribute(
            'id',
            'static-colliders-' +
            (
              this.el.id ||
              Math.random().toString(36).slice(2)
            )
          );

          this.el.sceneEl.appendChild(colliderContainer);

          const addColliderForMesh = (mesh) => {
            const box = new THREE.Box3().setFromObject(mesh);
            if (box.isEmpty()) return;

            const size = new THREE.Vector3();
            const center = new THREE.Vector3();

            box.getSize(size);
            box.getCenter(center);

            let horizontalExpand = 1.1;
            const verticalShrink = 0.92;

            const longRatioX =
              size.x /
              Math.max(size.z, 0.001);

            const longRatioZ =
              size.z /
              Math.max(size.x, 0.001);

            const smallThreshold = 0.4;

            if (longRatioX > 2 || longRatioZ > 2) {
              horizontalExpand = 1.02;
            } else if (
              size.x < smallThreshold &&
              size.z < smallThreshold
            ) {
              horizontalExpand = 1.2;
            } else if (
              size.x < smallThreshold ||
              size.z < smallThreshold
            ) {
              horizontalExpand = 1.15;
            }

            const isChairMesh = (node) => {
              let current = node;

              while (current) {
                if (
                  current.name &&
                  /chair/i.test(current.name)
                ) {
                  return true;
                }

                current = current.parent;
              }

              return false;
            };

            const isChair = isChairMesh(mesh);

            const isChairFrame =
              mesh.name &&
              /leg|support|spine|back|seat|backrest/i
                .test(mesh.name);

            if (isChair) {
              horizontalExpand =
                Math.min(horizontalExpand, 0.92);

              size.y *= 0.95;

              if (
                size.x < 0.18 ||
                size.z < 0.18
              ) {
                horizontalExpand =
                  Math.min(horizontalExpand, 0.88);
              }
            }

            if (isChairFrame) {
              horizontalExpand =
                Math.min(horizontalExpand, 0.95);
            }

            size.x *= horizontalExpand;
            size.z *= horizontalExpand;
            size.y *= verticalShrink;

            const quaternion =
              mesh.getWorldQuaternion(
                new THREE.Quaternion()
              );

            const euler =
              new THREE.Euler()
                .setFromQuaternion(
                  quaternion,
                  'YXZ'
                );

            const collider =
              document.createElement('a-entity');

            collider.setAttribute(
              'class',
              'static-collider'
            );

            collider.setAttribute(
              'geometry',
              `primitive: box; ` +
              `width: ${Math.max(size.x, 0.01)}; ` +
              `height: ${Math.max(size.y, 0.01)}; ` +
              `depth: ${Math.max(size.z, 0.01)}`
            );

            collider.setAttribute(
              'position',
              `${center.x} ${center.y} ${center.z}`
            );

            collider.setAttribute(
              'rotation',
              `${THREE.MathUtils.radToDeg(euler.x)} ` +
              `${THREE.MathUtils.radToDeg(euler.y)} ` +
              `${THREE.MathUtils.radToDeg(euler.z)}`
            );

            collider.setAttribute('visible', 'false');

            colliderContainer.appendChild(collider);
          };

          root.traverse((node) => {
            if (!node.isMesh) return;

            let current = node;
            let matches = false;

            while (current) {
              if (
                current.name &&
                this.data.objectKeys.some(
                  (key) =>
                    current.name
                      .toLowerCase()
                      .includes(key)
                )
              ) {
                matches = true;
                break;
              }

              current = current.parent;
            }

            if (
              !matches &&
              (
                this.el.classList.contains('roompart') ||
                this.el.classList.contains('door')
              )
            ) {
              matches = true;
            }

            if (matches) {
              addColliderForMesh(node);
            }
          });
        });
      }
    });


    /* ============================================================
       Component 4: simple-collider

       PERFORMANCE FIX:
       Only lightweight .item and .static-collider meshes are used.
       The six full .roompart GLB meshes are no longer checked every
       frame.
    ============================================================ */
    AFRAME.registerComponent('simple-collider', {
      schema: {
        objects: {
          default: '.item, .static-collider'
        },

        radius: {
          default: 0.4
        }
      },

      init: function () {
        this.raycaster = new THREE.Raycaster();
        this.prevWorldPos = new THREE.Vector3();
        this.prevLocalPos = new THREE.Vector3();
        this.dir = new THREE.Vector3();
        this.side = new THREE.Vector3();

        setTimeout(() => {
          this.el.object3D.getWorldPosition(
            this.prevWorldPos
          );

          this.prevLocalPos.copy(
            this.el.object3D.position
          );
        }, 200);
      },

      getCollisionMeshes: function (heldEl) {
        const meshes = [];

        const elements =
          this.el.sceneEl.querySelectorAll(
            this.data.objects
          );

        elements.forEach((element) => {
          if (element === heldEl) return;

          const root = element.getObject3D('mesh');
          if (!root) return;

          root.updateMatrixWorld(true);

          root.traverse((node) => {
            if (node.isMesh) {
              meshes.push(node);
            }
          });
        });

        return meshes;
      },

      tick: function () {
        const currentWorldPos =
          new THREE.Vector3();

        this.el.object3D.getWorldPosition(
          currentWorldPos
        );

        this.dir.subVectors(
          currentWorldPos,
          this.prevWorldPos
        );

        const distance = this.dir.length();
        if (distance < 0.001) return;

        this.dir.normalize();

        const heldItem =
          this.el.sceneEl.heldItem;

        const heldEl =
          heldItem
            ? heldItem.el
            : null;

        const meshes =
          this.getCollisionMeshes(heldEl);

        if (!meshes.length) {
          this.prevWorldPos.copy(currentWorldPos);

          this.prevLocalPos.copy(
            this.el.object3D.position
          );

          return;
        }

        this.side.set(
          -this.dir.z,
          0,
          this.dir.x
        );

        const radius = this.data.radius;
        const heights = [0.4, 0.8, 1.2];

        const lateralOffsets = [
          0,
          -radius * 0.5,
          radius * 0.5
        ];

        let hit = false;

        outer:
        for (const height of heights) {
          for (const offset of lateralOffsets) {
            const origin =
              this.prevWorldPos.clone();

            origin.y =
              this.prevWorldPos.y -
              1.1 +
              height;

            origin.addScaledVector(
              this.side,
              offset
            );

            this.raycaster.set(
              origin,
              this.dir
            );

            this.raycaster.far =
              distance + radius;

            const intersections =
              this.raycaster.intersectObjects(
                meshes,
                true
              );

            if (
              intersections.length > 0 &&
              intersections[0].distance <=
                distance + radius
            ) {
              hit = true;
              break outer;
            }
          }
        }

        if (hit) {
          this.el.object3D.position.copy(
            this.prevLocalPos
          );
        } else {
          this.prevWorldPos.copy(
            currentWorldPos
          );

          this.prevLocalPos.copy(
            this.el.object3D.position
          );
        }
      }
    });


    /* ============================================================
       Component 5: head-bob
    ============================================================ */
    AFRAME.registerComponent('head-bob', {
      schema: {
        amount: { default: 0.03 },
        speed: { default: 12 }
      },

      init: function () {
        this.baseY =
          this.el.object3D.position.y;

        this.time = 0;

        this.prevPos =
          new THREE.Vector3();

        this.el.object3D.getWorldPosition(
          this.prevPos
        );
      },

      tick: function (t, dt) {
        const currentPos =
          new THREE.Vector3();

        this.el.object3D.getWorldPosition(
          currentPos
        );

        const dx =
          currentPos.x -
          this.prevPos.x;

        const dz =
          currentPos.z -
          this.prevPos.z;

        const distance =
          Math.sqrt(
            dx * dx +
            dz * dz
          );

        if (
          distance > 0.001 &&
          distance < 0.5
        ) {
          this.time +=
            dt *
            0.001 *
            this.data.speed;

          this.el.object3D.position.y =
            this.baseY +
            Math.sin(this.time) *
            this.data.amount;
        } else {
          this.el.object3D.position.y =
            THREE.MathUtils.lerp(
              this.el.object3D.position.y,
              this.baseY,
              0.1
            );
        }

        this.prevPos.copy(currentPos);
      }
    });


    /* ============================================================
       Component 6: grabbable
    ============================================================ */
    AFRAME.registerComponent('grabbable', {
      init: function () {
        this.isGrabbed = false;
        this.cam = document.querySelector('#cam');

        this.dropRay =
          new THREE.Raycaster();

        this.dropRay.far = 4;

        this.el.addEventListener('mousedown', () => {
          const scene = this.el.sceneEl;

          if (!this.isGrabbed) {
            if (
              scene.heldItem &&
              scene.heldItem !== this
            ) {
              return;
            }

            this.isGrabbed = true;
            scene.heldItem = this;

            this.cam.object3D.attach(
              this.el.object3D
            );

            this.el.object3D.position.set(
              0,
              -0.3,
              -1
            );
          } else {
            this.isGrabbed = false;
            scene.heldItem = null;

            const worldPos =
              new THREE.Vector3();

            this.el.object3D.getWorldPosition(
              worldPos
            );

            this.el.sceneEl.object3D.attach(
              this.el.object3D
            );

            const colliders = [];

            Array.from(
              this.el.sceneEl.querySelectorAll(
                '.roompart, .item'
              )
            ).forEach((element) => {
              if (element === this.el) return;

              const mesh =
                element.getObject3D('mesh');

              if (!mesh) return;

              mesh.updateMatrixWorld(true);

              mesh.traverse((node) => {
                if (node.isMesh) {
                  colliders.push(node);
                }
              });
            });

            if (colliders.length) {
              this.dropRay.set(
                new THREE.Vector3(
                  worldPos.x,
                  worldPos.y + 1,
                  worldPos.z
                ),

                new THREE.Vector3(
                  0,
                  -1,
                  0
                )
              );

              const hit =
                this.dropRay.intersectObjects(
                  colliders,
                  true
                )[0];

              if (hit) {
                this.el.object3D.position.y =
                  hit.point.y + 0.03;
              }
            }
          }
        });
      }
    });


    /* ============================================================
       Component 7: audio-unlock

       No visible start screen. The room sounds begin after the
       first click, key press, controller trigger, or entering VR.
    ============================================================ */
    AFRAME.registerComponent('audio-unlock', {
      init: function () {
        this.started = false;

        this.startAudio =
          this.startAudio.bind(this);

        this.playRoomSounds =
          this.playRoomSounds.bind(this);

        window.addEventListener(
          'pointerdown',
          this.startAudio,
          { once: true }
        );

        window.addEventListener(
          'keydown',
          this.startAudio,
          { once: true }
        );

        this.el.addEventListener(
          'enter-vr',
          this.startAudio
        );

        this.el.addEventListener('loaded', () => {
          const leftHand =
            document.querySelector('#leftHand');

          const rightHand =
            document.querySelector('#rightHand');

          if (leftHand) {
            leftHand.addEventListener(
              'triggerdown',
              this.startAudio,
              { once: true }
            );
          }

          if (rightHand) {
            rightHand.addEventListener(
              'triggerdown',
              this.startAudio,
              { once: true }
            );
          }
        });
      },

      startAudio: async function () {
        if (this.started) return;

        try {
          const audioContext =
            THREE.AudioContext.getContext();

          if (
            audioContext.state ===
            'suspended'
          ) {
            await audioContext.resume();
          }

          this.started = true;
          this.el.audioUnlocked = true;

          this.playRoomSounds();

          window.setTimeout(
            this.playRoomSounds,
            800
          );

          window.setTimeout(
            this.playRoomSounds,
            2000
          );

          console.log('Room audio unlocked.');
        } catch (error) {
          console.error(
            'Audio could not start:',
            error
          );
        }
      },

      playRoomSounds: function () {
        document
          .querySelectorAll('.room-sound')
          .forEach((entity) => {
            const sound =
              entity.components.sound;

            if (
              sound &&
              !sound.isPlaying
            ) {
              sound.playSound();
            }
          });
      }
    });


    /* ============================================================
       Component 8: footstep-player
    ============================================================ */
    AFRAME.registerComponent('footstep-player', {
      schema: {
        minSpeed: { default: 0.02 },
        maxSpeed: { default: 4 }
      },

      init: function () {
        this.previousLocalPosition =
          this.el.object3D.position.clone();

        this.isPlaying = false;
      },

      tick: function (time, deltaTime) {
        if (!deltaTime) return;

        const currentLocalPosition =
          this.el.object3D.position;

        const deltaX =
          currentLocalPosition.x -
          this.previousLocalPosition.x;

        const deltaZ =
          currentLocalPosition.z -
          this.previousLocalPosition.z;

        const horizontalDistance =
          Math.sqrt(
            deltaX * deltaX +
            deltaZ * deltaZ
          );

        const speed =
          horizontalDistance /
          (deltaTime / 1000);

        const isWalking =
          speed >= this.data.minSpeed &&
          speed <= this.data.maxSpeed;

        const sound =
          this.el.components.sound;

        const audioUnlocked =
          this.el.sceneEl.audioUnlocked;

        if (
          isWalking &&
          audioUnlocked &&
          sound &&
          !this.isPlaying
        ) {
          sound.playSound();
          this.isPlaying = true;
        } else if (
          (!isWalking || !audioUnlocked) &&
          sound &&
          this.isPlaying
        ) {
          sound.stopSound();
          this.isPlaying = false;
        }

        this.previousLocalPosition.copy(
          currentLocalPosition
        );
      }
    });
  </script>


  <a-scene
    audio-unlock

    fog="
      type: exponential;
      color: #050805;
      density: 0.04"

    background="
      color: #020202"

    shadow="
      type: pcfsoft"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;">


    <a-assets>
      <a-asset-item
        id="bantho-model"
        src="bantho.glb">
      </a-asset-item>

      <a-asset-item
        id="bedroom-model"
        src="bedroomasset.glb">
      </a-asset-item>

      <a-asset-item
        id="kitchen-model"
        src="kitchenasset.glb">
      </a-asset-item>

      <a-asset-item
        id="living-model"
        src="livingasset.glb">
      </a-asset-item>

      <a-asset-item
        id="toilet-model"
        src="toiletasset.glb">
      </a-asset-item>

      <a-asset-item
        id="wallandground-model"
        src="wallandground.glb">
      </a-asset-item>

      <a-asset-item
        id="cua-model"
        src="cua.glb">
      </a-asset-item>

      <a-asset-item
        id="teddy-model"
        src="teddy.glb">
      </a-asset-item>

      <a-asset-item
        id="hairpin-model"
        src="hairpin.glb">
      </a-asset-item>
    </a-assets>


    <!-- LIGHTING -->
    <a-light
      type="ambient"
      color="#1c261c"
      intensity="0.45">
    </a-light>

    <a-entity
      position="-3.5 2.6 -1"

      light="
        type: point;
        color: #7cb860;
        intensity: 8;
        distance: 12;
        decay: 2;
        castShadow: true"

      flicker="
        min: 6.5;
        max: 8.5;
        speed: 0.3">
    </a-entity>

    <a-entity
      position="2.5 2.6 1.5"

      light="
        type: point;
        color: #ffdb59;

        distance: 15;
        decay: 2;
        castShadow: true"

        max: 10.5;
        speed: 0.2">
    </a-entity>


    <!-- SIX ROOM PARTS -->
    <a-entity
      id="wallandground"

      gltf-model="#wallandground-model"

    </a-entity>

    <a-entity
      id="living"
      class="roompart"
      gltf-model="#living-model"
      position="0 0 0"

      tag-colliders>
    </a-entity>

    <a-entity
      id="kitchen"

      position="0 0 0"

    </a-entity>

    <a-entity
      id="bedroom"
      class="roompart"
      gltf-model="#bedroom-model"
      position="0 0 0"
      tag-floors
      tag-colliders>
    </a-entity>

    <a-entity
      id="toilet"
      class="roompart"
      gltf-model="#toilet-model"
      position="0 0 0"

    </a-entity>

    <a-entity
      id="bantho"

      gltf-model="#bantho-model"

    <!-- POSITIONAL ROOM SOUNDS -->

    <a-entity
      id="bedroom-fan-sound"
      class="room-sound"
      position="-2 2.3 -3"

      sound="
        src: url(sounds/bedroom-fan.wav);
        autoplay: false;

        positional: true;
        volume: 0.45;
        distanceModel: inverse;
        refDistance: 1.5;
        maxDistance: 8;
        rolloffFactor: 1.2">
    </a-entity>

    <a-entity
      id="bedroom-lamp-sound"
      class="room-sound"
      position="-2 1.5 -3"

      sound="
        src: url(sounds/lamp-buzz.wav);
        autoplay: false;
        loop: true;
        positional: true;
        volume: 0.2;
        distanceModel: inverse;
        refDistance: 1;
        maxDistance: 5;
        rolloffFactor: 1.5">
    </a-entity>

    <a-entity
      id="bedroom-rain-sound"
      class="room-sound"
      position="-3 1.7 -4"

      sound="
        src: url(sounds/bedroom-rain.wav);
        autoplay: false;
        loop: true;
        positional: true;
        volume: 0.3;
        distanceModel: inverse;
        refDistance: 1.5;
        maxDistance: 10;
        rolloffFactor: 1">
    </a-entity>

    <a-entity
      id="living-tv-sound"
      class="room-sound"
      position="2 1.1 0"

      sound="
        src: url(sounds/tv-static.mp3);
        autoplay: false;
        loop: true;
        positional: true;
        volume: 0.35;
        distanceModel: inverse;
        refDistance: 1;
        maxDistance: 8;
        rolloffFactor: 1.4">
    </a-entity>

    <a-entity
      id="living-light-sound"
      class="room-sound"
      position="2 2.5 0"

      sound="
        src: url(sounds/fluorescent-light.wav);
        autoplay: false;
        loop: true;
        positional: true;
        volume: 0.25;
        distanceModel: inverse;
        refDistance: 1;
        maxDistance: 7;
        rolloffFactor: 1.3">
    </a-entity>

    <a-entity
      id="living-rain-sound"
      class="room-sound"
      position="3 1.7 -1"

      sound="
        src: url(sounds/living-room-rain.mp3);
        autoplay: false;
        loop: true;
        positional: true;
        volume: 0.3;
        distanceModel: inverse;
        refDistance: 1.5;
        maxDistance: 10;
        rolloffFactor: 1">
    </a-entity>


    <!-- INTERACTIVE OBJECTS -->
    <a-entity
      class="item door"
      gltf-model="#cua-model"
      position="0 0 0"
      tag-colliders>
    </a-entity>

    <a-entity
      gltf-model="#teddy-model"
      position="1 0.6 -2"
      class="item"
      grabbable

      animation__hoverin="
        property: scale;
        to: 1.1 1.1 1.1;
        startEvents: mouseenter;
        dur: 200"

      animation__hoverout="
        property: scale;
        to: 1 1 1;
        startEvents: mouseleave;
        dur: 200">
    </a-entity>

    <a-entity
      gltf-model="#hairpin-model"
      position="1.5 0.6 -2"
      class="item"
      grabbable

      animation__hoverin="
        property: scale;
        to: 1.2 1.2 1.2;
        startEvents: mouseenter;
        dur: 200"

      animation__hoverout="
        property: scale;
        to: 1 1 1;
        startEvents: mouseleave;
        dur: 200">
    </a-entity>


    <!-- PLAYER / VR MOVEMENT -->
    <a-entity
      id="rig"
      position="1 0 0.5">

      <a-entity
        id="cam"

        camera="
          near: 0.01;
          fov: 60"

        position="0 1.1 0"

        look-controls

        movement-controls="
          speed: 0.15;
          controls: gamepad, keyboard, touch;
          fly: false"

        simple-collider="
          objects: .item, .static-collider;
          radius: 0.4"

        head-bob="
          amount: 0.035;
          speed: 14"

        sound="
          src: url(sounds/842186__aardsreel__footstep-floor.wav);
          autoplay: false;
          loop: true;
          positional: false;
          volume: 0.55"

        footstep-player="
          minSpeed: 0.02;
          maxSpeed: 4">

        <a-cursor
          color="#ffffff"
          scale="0.7 0.7 0.7"

          cursor="
            rayOrigin: mouse;
            fuse: false"

          raycaster="
            objects: .door, .item;
            far: 6">
        </a-cursor>
      </a-entity>

      <a-entity
        id="leftHand"

        hand-controls="
          hand: left"

        teleport-controls="
          cameraRig: #rig;
          teleportOrigin: #cam;
          button: trigger;
          collisionEntities: .floor;
          startEvents: triggerdown;
          endEvents: triggerup">
      </a-entity>

      <a-entity
        id="rightHand"

        hand-controls="
          hand: right"

        teleport-controls="
          cameraRig: #rig;
          teleportOrigin: #cam;
          button: trigger;
          collisionEntities: .floor;
          startEvents: triggerdown;
          endEvents: triggerup">
      </a-entity>
    </a-entity>

  </a-scene>

</body>
</html>
