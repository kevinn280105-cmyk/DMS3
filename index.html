<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>VR Room - 45 Degree Door + Reliable Teddy Pickup</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- movement-controls for keyboard, touch and VR thumbsticks -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <!-- Blink teleport -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #020202;
    }

    #vignette {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;

      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0) 50%,
        rgba(5, 8, 5, 0.5) 100%
      );
    }

    #soundButton {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1000;

      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 8px;

      color: white;
      background: rgba(0, 0, 0, 0.82);

      font: 600 15px Arial, sans-serif;
      cursor: pointer;
    }

    #soundButton:disabled {
      opacity: 0.7;
      cursor: default;
    }
  </style>
</head>

<body>
  <div id="vignette"></div>
  <button id="soundButton" type="button" onclick="enableSound()">
    ENABLE SOUND
  </button>

  <!--
    Native browser audio is used here because it is more reliable
    on the Quest browser than waiting for an A-Frame sound component
    to initialise.
  -->
  <audio
    id="fanAudio"
    src="sounds/73347__noisecollector__noisy_ceiling_fan.mp3"
    preload="auto"
    loop
    playsinline>
  </audio>

  <audio
    id="bedroomRainAudio"
    src="sounds/bedroom-rain.wav"
    preload="auto"
    loop
    playsinline>
  </audio>

  <audio
    id="fluorescentAudio"
    src="sounds/fluorescent-light.wav"
    preload="auto"
    loop
    playsinline>
  </audio>

  <audio
    id="tvStaticAudio"
    src="sounds/tv-static.mp3"
    preload="auto"
    loop
    playsinline>
  </audio>

  <audio
    id="footstepAudio"
    src="sounds/842186__aardsreal__footstep-floor.wav"
    preload="auto"
    loop
    playsinline>
  </audio>

  <script>
    /* ============================================================
       RELIABLE SOUND BUTTON

       The button updates immediately, before any audio loading.
       All play() calls begin during the same real button click,
       which is important because browsers block automatic sound.
    ============================================================ */
    async function enableSound() {
      const button =
        document.querySelector('#soundButton');

      if (!button) {
        return;
      }

      button.textContent = 'STARTING SOUND...';
      button.disabled = true;

      const tracks = [
        {
          element: document.querySelector('#fanAudio'),
          volume: 0.28
        },
        {
          element: document.querySelector('#bedroomRainAudio'),
          volume: 0.22
        },
        {
          element: document.querySelector('#fluorescentAudio'),
          volume: 0.18
        },
        {
          element: document.querySelector('#tvStaticAudio'),
          volume: 0.08
        }
      ];

      const playPromises = tracks.map(({ element, volume }) => {
        if (!element) {
          return Promise.reject(
            new Error('A sound element is missing.')
          );
        }

        element.volume = volume;

        return element.play();
      });

      const results =
        await Promise.allSettled(playPromises);

      const successful =
        results.filter(
          result => result.status === 'fulfilled'
        ).length;

      results.forEach((result, index) => {
        if (result.status === 'rejected') {
          console.error(
            'Sound failed:',
            tracks[index].element
              ? tracks[index].element.src
              : 'missing audio element',
            result.reason
          );
        }
      });

      const scene =
        document.querySelector('a-scene');

      if (successful > 0) {
        if (scene) {
          scene.audioUnlocked = true;
        }

        button.textContent = 'SOUND ENABLED';

        window.setTimeout(() => {
          button.style.display = 'none';
        }, 1200);

        console.log(
          `${successful} ambience sound file(s) started.`
        );
      } else {
        button.textContent = 'TRY SOUND AGAIN';
        button.disabled = false;

        console.error(
          'No sound file could start. Check the Network and Console tabs.'
        );
      }
    }

    window.enableSound = enableSound;

    /* ============================================================
       1. FLICKERING LIGHTS
    ============================================================ */
    AFRAME.registerComponent('flicker', {
      schema: {
        min: { default: 0.8 },
        max: { default: 1.2 },
        speed: { default: 0.5 }
      },

      init: function () {
        this.seed = Math.random() * 1000;
      },

      tick: function (timeMs) {
        const time =
          (timeMs * 0.001 * this.data.speed) +
          this.seed;

        const noise = (
          Math.sin(time * 6.1) +
          Math.sin(time * 2.3) +
          Math.sin(time * 11.7)
        ) / 3;

        const intensity =
          this.data.min +
          ((noise + 1) / 2) *
          (this.data.max - this.data.min);

        this.el.setAttribute(
          'light',
          'intensity',
          intensity
        );
      }
    });


    /* ============================================================
       2. MODEL LOAD STATUS

       Open the browser Console to see which GLB loaded or failed.
    ============================================================ */
    AFRAME.registerComponent('model-status', {
      schema: {
        name: { default: '3D model' }
      },

      init: function () {
        this.el.addEventListener('model-loaded', () => {
          console.log(
            `${this.data.name} loaded successfully.`
          );
        });

        this.el.addEventListener('model-error', (event) => {
          console.error(
            `${this.data.name} failed to load.`,
            event.detail
          );
        });
      }
    });


    /* ============================================================
       3. CREATE TELEPORT FLOORS FROM NAMED BLENDER OBJECTS

       A permanent fallback floor is also included in the HTML,
       so teleport still works when the Blender names do not match.
    ============================================================ */
    AFRAME.registerComponent('tag-floors', {
      schema: {
        floorNames: {
          type: 'array',

          default: [
            'san nha phong khach',
            'san nha phong an',
            'san nha TOILET',
            'san giat do',
            'SAN PHONG NGU'
          ]
        }
      },

      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');

          if (!root) {
            return;
          }

          root.updateMatrixWorld(true);

          let container =
            document.querySelector('#generated-teleport-floors');

          if (!container) {
            container = document.createElement('a-entity');
            container.setAttribute(
              'id',
              'generated-teleport-floors'
            );
            this.el.sceneEl.appendChild(container);
          }

          this.data.floorNames.forEach((name) => {
            const object = root.getObjectByName(name);

            if (!object) {
              return;
            }

            object.updateMatrixWorld(true);

            const box =
              new THREE.Box3().setFromObject(object);

            if (box.isEmpty()) {
              return;
            }

            const size = new THREE.Vector3();
            const center = new THREE.Vector3();

            box.getSize(size);
            box.getCenter(center);

            const plane = document.createElement('a-plane');

            plane.setAttribute('class', 'floor');
            plane.setAttribute('rotation', '-90 0 0');

            plane.setAttribute(
              'width',
              Math.max(size.x, 0.1)
            );

            plane.setAttribute(
              'height',
              Math.max(size.z, 0.1)
            );

            plane.setAttribute(
              'position',
              `${center.x} ${box.min.y + 0.02} ${center.z}`
            );

            plane.setAttribute(
              'material',
              'opacity: 0; transparent: true; depthWrite: false'
            );

            container.appendChild(plane);
          });
        });
      }
    });


    /* ============================================================
       4. DESKTOP HEAD BOB

       Disabled in immersive VR to avoid conflicting with real
       headset tracking.
    ============================================================ */
    AFRAME.registerComponent('head-bob', {
      schema: {
        amount: { default: 0.025 },
        speed: { default: 11 }
      },

      init: function () {
        this.baseY = this.el.object3D.position.y;
        this.time = 0;

        this.previousPosition = new THREE.Vector3();
        this.currentPosition = new THREE.Vector3();

        this.el.object3D.getWorldPosition(
          this.previousPosition
        );
      },

      tick: function (time, deltaTime) {
        if (this.el.sceneEl.is('vr-mode')) {
          return;
        }

        this.el.object3D.getWorldPosition(
          this.currentPosition
        );

        const deltaX =
          this.currentPosition.x -
          this.previousPosition.x;

        const deltaZ =
          this.currentPosition.z -
          this.previousPosition.z;

        const distance = Math.sqrt(
          (deltaX * deltaX) +
          (deltaZ * deltaZ)
        );

        if (
          distance > 0.001 &&
          distance < 0.5
        ) {
          this.time +=
            deltaTime *
            0.001 *
            this.data.speed;

          this.el.object3D.position.y =
            this.baseY +
            Math.sin(this.time) *
            this.data.amount;
        } else {
          this.el.object3D.position.y =
            THREE.MathUtils.lerp(
              this.el.object3D.position.y,
              this.baseY,
              0.1
            );
        }

        this.previousPosition.copy(
          this.currentPosition
        );
      }
    });


    /* ============================================================
       5. DOOR OPEN / CLOSE
    ============================================================ */
    AFRAME.registerComponent('door-hinge', {
      schema: {
        openAngle: { default: 45 },
        hingeSide: {
          default: 'left',
          oneOf: ['left', 'right']
        },
        speed: { default: 7 }
      },

      init: function () {
        this.isOpen = false;
        this.currentAngle = 0;
        this.targetAngle = 0;
        this.pivot = null;
        this.lastActivation = 0;

        this.activate =
          this.activate.bind(this);

        this.el.addEventListener(
          'model-loaded',
          () => this.createHinge()
        );

        this.el.addEventListener(
          'activate-object',
          this.activate
        );

        this.el.addEventListener(
          'click',
          this.activate
        );

        this.el.addEventListener(
          'vr-activate',
          this.activate
        );
      },

      getLocalBoundingBox: function (model) {
        const localBox = new THREE.Box3();
        localBox.makeEmpty();

        this.el.object3D.updateMatrixWorld(true);
        model.updateMatrixWorld(true);

        const inverseEntityWorld =
          new THREE.Matrix4().copy(
            this.el.object3D.matrixWorld
          ).invert();

        model.traverse((node) => {
          if (!node.isMesh || !node.geometry) {
            return;
          }

          if (!node.geometry.boundingBox) {
            node.geometry.computeBoundingBox();
          }

          if (!node.geometry.boundingBox) {
            return;
          }

          const nodeToEntity =
            new THREE.Matrix4().multiplyMatrices(
              inverseEntityWorld,
              node.matrixWorld
            );

          const nodeBox =
            node.geometry.boundingBox
              .clone()
              .applyMatrix4(nodeToEntity);

          localBox.union(nodeBox);
        });

        return localBox;
      },

      createHinge: function () {
        const model =
          this.el.getObject3D('mesh');

        if (!model || this.pivot) {
          return;
        }

        const box =
          this.getLocalBoundingBox(model);

        if (box.isEmpty()) {
          return;
        }

        const size = new THREE.Vector3();
        const center = new THREE.Vector3();

        box.getSize(size);
        box.getCenter(center);

        /*
          A real door rotates around one vertical edge. The pivot is
          placed at one end of the door's longest horizontal axis.
          That hinge edge remains stationary while the opposite side
          swings through a 45-degree arc.
        */
        const widthRunsAlongX =
          size.x >= size.z;

        const hingeLocal =
          center.clone();

        if (widthRunsAlongX) {
          hingeLocal.x =
            this.data.hingeSide === 'left'
              ? box.min.x
              : box.max.x;
        } else {
          hingeLocal.z =
            this.data.hingeSide === 'left'
              ? box.min.z
              : box.max.z;
        }

        const pivot = new THREE.Group();
        pivot.name = 'real-door-hinge';
        pivot.position.copy(hingeLocal);

        this.el.object3D.add(pivot);
        this.el.object3D.updateMatrixWorld(true);
        pivot.updateMatrixWorld(true);
        model.updateMatrixWorld(true);

        /*
          Preserve the door's exact world position when it becomes a
          child of the hinge. Only the hinge rotates afterward.
        */
        pivot.attach(model);

        this.pivot = pivot;

        console.log(
          'Door hinge ready:',
          this.data.hingeSide,
          'side,',
          this.data.openAngle,
          'degrees.'
        );
      },

      activate: function (event) {
        if (
          event &&
          event.target !== this.el &&
          event.type !== 'activate-object'
        ) {
          return;
        }

        const now = performance.now();

        if (now - this.lastActivation < 250) {
          return;
        }

        this.lastActivation = now;
        this.isOpen = !this.isOpen;

        this.targetAngle =
          THREE.MathUtils.degToRad(
            this.isOpen
              ? this.data.openAngle
              : 0
          );
      },

      tick: function (time, deltaTime) {
        if (!this.pivot || !deltaTime) {
          return;
        }

        const amount =
          Math.min(
            1,
            (deltaTime / 1000) *
            this.data.speed
          );

        this.currentAngle =
          THREE.MathUtils.lerp(
            this.currentAngle,
            this.targetAngle,
            amount
          );

        this.pivot.rotation.y =
          this.currentAngle;
      }
    });


    /* ============================================================
       INTERACTION PROXY

       The invisible hitbox forwards interaction to its parent item.
    ============================================================ */
    AFRAME.registerComponent('interaction-proxy', {
      schema: {
        owner: { type: 'selector' }
      },

      init: function () {
        const forward = (event) => {
          if (event && event.stopPropagation) {
            event.stopPropagation();
          }

          if (this.data.owner) {
            this.data.owner.emit(
              'activate-object',
              {},
              false
            );
          }
        };

        this.el.addEventListener(
          'click',
          forward
        );

        this.el.addEventListener(
          'vr-activate',
          forward
        );
      }
    });


    /* ============================================================
       INVISIBLE INTERACTION HITBOX

       The hitbox itself is included in the controller raycaster.
    ============================================================ */
    AFRAME.registerComponent('easy-target', {
      schema: {
        padding: { default: 0.08 },
        minimumSize: { default: 0.25 }
      },

      init: function () {
        this.el.addEventListener(
          'model-loaded',
          () => this.createHitbox()
        );
      },

      createHitbox: function () {
        if (
          this.el.querySelector(
            '.interaction-hitbox'
          )
        ) {
          return;
        }

        const model =
          this.el.getObject3D('mesh');

        if (!model) {
          return;
        }

        this.el.object3D.updateMatrixWorld(true);
        model.updateMatrixWorld(true);

        const box =
          new THREE.Box3().setFromObject(model);

        if (box.isEmpty()) {
          return;
        }

        const size = new THREE.Vector3();
        const center = new THREE.Vector3();

        box.getSize(size);
        box.getCenter(center);

        const localCenter =
          this.el.object3D.worldToLocal(
            center.clone()
          );

        const padding =
          this.data.padding;

        const minimum =
          this.data.minimumSize;

        const hitbox =
          document.createElement('a-box');

        hitbox.setAttribute(
          'class',
          'interaction-hitbox interactable'
        );

        hitbox.setAttribute(
          'position',
          `${localCenter.x} ${localCenter.y} ${localCenter.z}`
        );

        hitbox.setAttribute(
          'width',
          Math.max(size.x + padding, minimum)
        );

        hitbox.setAttribute(
          'height',
          Math.max(size.y + padding, minimum)
        );

        hitbox.setAttribute(
          'depth',
          Math.max(size.z + padding, minimum)
        );

        hitbox.setAttribute(
          'material',
          'color: #ffffff; opacity: 0.001; transparent: true; depthWrite: false; side: double'
        );

        hitbox.setAttribute(
          'interaction-proxy',
          `owner: #${this.el.id}`
        );

        this.el.appendChild(hitbox);

        const rightRaycaster =
          document.querySelector('#rightHand');

        if (
          rightRaycaster &&
          rightRaycaster.components.raycaster &&
          rightRaycaster.components.raycaster.refreshObjects
        ) {
          rightRaycaster.components.raycaster.refreshObjects();
        }
      }
    });


    /* ============================================================
       6. GRAB AND DROP TEDDY / HAIRPIN

       Desktop:
       Click an object to pick it up.
       Click it again to drop it.

       VR:
       Right trigger picks it up.
       Right grip button drops the held object.
    ============================================================ */
    AFRAME.registerComponent('grabbable', {
      init: function () {
        this.isGrabbed = false;
        this.lastActivation = 0;
        this.originalParent = null;

        this.dropRay =
          new THREE.Raycaster();

        this.dropRay.far = 8;

        this.activate =
          this.activate.bind(this);

        this.el.addEventListener(
          'activate-object',
          this.activate
        );

        this.el.addEventListener(
          'click',
          this.activate
        );

        this.el.addEventListener(
          'vr-activate',
          this.activate
        );
      },

      activate: function (event) {
        if (
          event &&
          event.target !== this.el &&
          event.type !== 'activate-object'
        ) {
          return;
        }

        const now = performance.now();

        if (now - this.lastActivation < 250) {
          return;
        }

        this.lastActivation = now;

        if (this.isGrabbed) {
          this.drop();
        } else {
          this.grab();
        }
      },

      grab: function () {
        const scene =
          this.el.sceneEl;

        if (
          scene.heldItem &&
          scene.heldItem !== this
        ) {
          return;
        }

        const holder =
          scene.is('vr-mode')
            ? document.querySelector('#rightHandHold')
            : document.querySelector('#desktopHold');

        if (!holder) {
          console.error(
            'Cannot pick up the object: hold anchor was not found.'
          );
          return;
        }

        this.originalParent =
          this.el.parentElement;

        this.isGrabbed = true;
        scene.heldItem = this;

        /*
          Reparent through the A-Frame DOM rather than only changing
          Three.js parents. This keeps A-Frame and Three.js in sync.
        */
        holder.appendChild(this.el);

        this.el.object3D.position.set(0, 0, 0);
        this.el.object3D.rotation.set(0, 0, 0);

        console.log(
          this.el.id,
          'picked up.'
        );
      },

      drop: function () {
        if (!this.isGrabbed) {
          return;
        }

        const scene =
          this.el.sceneEl;

        const worldPosition =
          new THREE.Vector3();

        const worldQuaternion =
          new THREE.Quaternion();

        const worldScale =
          new THREE.Vector3();

        this.el.object3D.getWorldPosition(
          worldPosition
        );

        this.el.object3D.getWorldQuaternion(
          worldQuaternion
        );

        this.el.object3D.getWorldScale(
          worldScale
        );

        scene.appendChild(this.el);

        this.el.object3D.position.copy(
          worldPosition
        );

        this.el.object3D.quaternion.copy(
          worldQuaternion
        );

        this.el.object3D.scale.copy(
          worldScale
        );

        this.isGrabbed = false;
        scene.heldItem = null;

        const roomMeshes = [];

        scene
          .querySelectorAll('.roompart')
          .forEach((entity) => {
            const root =
              entity.getObject3D('mesh');

            if (!root) {
              return;
            }

            root.updateMatrixWorld(true);

            root.traverse((node) => {
              if (node.isMesh) {
                roomMeshes.push(node);
              }
            });
          });

        if (roomMeshes.length) {
          this.dropRay.set(
            new THREE.Vector3(
              worldPosition.x,
              worldPosition.y + 1.5,
              worldPosition.z
            ),

            new THREE.Vector3(
              0,
              -1,
              0
            )
          );

          const hit =
            this.dropRay.intersectObjects(
              roomMeshes,
              true
            )[0];

          if (hit) {
            this.el.object3D.updateMatrixWorld(true);

            const objectBox =
              new THREE.Box3().setFromObject(
                this.el.object3D
              );

            const lift =
              hit.point.y -
              objectBox.min.y +
              0.015;

            this.el.object3D.position.y +=
              lift;
          }
        }

        console.log(
          this.el.id,
          'dropped.'
        );
      }
    });


    /* ============================================================
       RIGHT-CONTROLLER INTERACTION
    ============================================================ */
    AFRAME.registerComponent('vr-interactor', {
      init: function () {
        this.el.addEventListener(
          'triggerdown',
          () => this.useTrigger()
        );

        this.el.addEventListener(
          'gripdown',
          () => this.dropHeldItem()
        );
      },

      resolveOwner: function (element) {
        let current = element;

        while (
          current &&
          current !== this.el.sceneEl
        ) {
          if (
            current.components &&
            (
              current.components.grabbable ||
              current.components['door-hinge']
            )
          ) {
            return current;
          }

          current = current.parentElement;
        }

        return null;
      },

      useTrigger: function () {
        const scene =
          this.el.sceneEl;

        if (scene.heldItem) {
          scene.heldItem.drop();
          return;
        }

        const raycaster =
          this.el.components.raycaster;

        if (!raycaster) {
          console.error(
            'Right-controller raycaster was not found.'
          );
          return;
        }

        if (raycaster.refreshObjects) {
          raycaster.refreshObjects();
        }

        const candidates = [];

        (raycaster.intersectedEls || [])
          .forEach((element) => {
            if (!candidates.includes(element)) {
              candidates.push(element);
            }
          });

        (raycaster.intersections || [])
          .forEach((intersection) => {
            const element =
              intersection.object &&
              intersection.object.el;

            if (
              element &&
              !candidates.includes(element)
            ) {
              candidates.push(element);
            }
          });

        for (const candidate of candidates) {
          const owner =
            this.resolveOwner(candidate);

          if (owner) {
            owner.emit(
              'activate-object',
              {},
              false
            );
            return;
          }
        }

        console.log(
          'Right trigger pressed, but no interactive object was targeted.'
        );
      },

      dropHeldItem: function () {
        const heldItem =
          this.el.sceneEl.heldItem;

        if (heldItem) {
          heldItem.drop();
        }
      }
    });


    /* ============================================================
       8. AUDIO UNLOCK

       No visible start screen is used.
       Audio starts after the first click, key press, controller
       trigger or after entering VR.
    ============================================================ */
    /* Native audio button replaces the old audio-unlock component. */


    /* ============================================================
       9. FOOTSTEPS

       Attached to the player rig so thumbstick and keyboard
       movement can trigger the footsteps.
    ============================================================ */
    AFRAME.registerComponent('footstep-player', {
      schema: {
        minSpeed: { default: 0.02 },
        maxSpeed: { default: 4 }
      },

      init: function () {
        this.previousPosition =
          this.el.object3D.position.clone();

        this.audio =
          document.querySelector('#footstepAudio');

        this.isPlaying = false;

        if (this.audio) {
          this.audio.volume = 0.5;
        }
      },

      tick: function (time, deltaTime) {
        if (
          !deltaTime ||
          !this.audio
        ) {
          return;
        }

        const currentPosition =
          this.el.object3D.position;

        const deltaX =
          currentPosition.x -
          this.previousPosition.x;

        const deltaZ =
          currentPosition.z -
          this.previousPosition.z;

        const distance =
          Math.sqrt(
            (deltaX * deltaX) +
            (deltaZ * deltaZ)
          );

        const speed =
          distance /
          (deltaTime / 1000);

        const isWalking =
          speed >= this.data.minSpeed &&
          speed <= this.data.maxSpeed;

        const audioUnlocked =
          this.el.sceneEl.audioUnlocked;

        if (
          isWalking &&
          audioUnlocked &&
          !this.isPlaying
        ) {
          const playPromise =
            this.audio.play();

          if (playPromise) {
            playPromise.catch((error) => {
              console.error(
                'Footstep sound failed:',
                error
              );
            });
          }

          this.isPlaying = true;
        } else if (
          (!isWalking ||
           !audioUnlocked) &&
          this.isPlaying
        ) {
          this.audio.pause();
          this.audio.currentTime = 0;
          this.isPlaying = false;
        }

        this.previousPosition.copy(
          currentPosition
        );
      }
    });
  </script>

        max: 8.5;

    </a-entity>


    <a-entity
      id="bedroom"
      class="roompart"
      gltf-model="url(bedroomasset.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Bedroom">
    </a-entity>
