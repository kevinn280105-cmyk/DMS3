<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>VR Room - Split Assets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <style>
    body { margin: 0; }
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 999;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(5,8,5,0.5) 100%);
    }
  </style>
</head>
<body>
 
  <div id="vignette"></div>
 
  <script>
    /* ============================================================
       DEBUG SWITCH
       -------------------------------------------------------------
       Set to true once, load the scene, open the browser / Quest
       console, and you'll see every mesh name printed per room
       part, PLUS the total collider count that tag-colliders built
       (this is the number that was blowing up performance before).
    ============================================================ */
    const DEBUG_LOG_MESH_NAMES = false;
 
    /* ============================================================
       Component 1: flicker
    ============================================================ */
    AFRAME.registerComponent('flicker', {
      schema: { min: { default: 0.8 }, max: { default: 1.2 }, speed: { default: 0.5 } },
      init: function () { this.seed = Math.random() * 1000; },
      tick: function (t) {
        const time = (t * 0.001 * this.data.speed) + this.seed;
        const noise = (Math.sin(time * 6.1) + Math.sin(time * 2.3) + Math.sin(time * 11.7)) / 3;
        this.el.setAttribute('light', 'intensity', this.data.min + ((noise + 1) / 2) * (this.data.max - this.data.min));
      }
    });
 
    /* ============================================================
       Component 2: tag-floors
    ============================================================ */
    AFRAME.registerComponent('tag-floors', {
      schema: { floorNames: { default: ['san nha phong khach','san nha phoing an','san nha TOILET','san giat do','SAN PHONG NGU'] } },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');
          if (!root) return;
 
          if (DEBUG_LOG_MESH_NAMES) {
            console.log('--- Mesh names in', this.el.id, '---');
            root.traverse((n) => { if (n.name) console.log('  ', n.name); });
          }
 
          const floorContainer = document.createElement('a-entity');
          floorContainer.setAttribute('id', 'floor-colliders-' + this.el.id);
          this.el.sceneEl.appendChild(floorContainer);
 
          let foundAny = false;
 
          this.data.floorNames.forEach((name) => {
            const obj = root.getObjectByName(name);
            if (!obj) return;
            foundAny = true;
            const box = new THREE.Box3().setFromObject(obj);
            const size = new THREE.Vector3(); const center = new THREE.Vector3();
            box.getSize(size); box.getCenter(center);
            const plane = document.createElement('a-plane');
            plane.setAttribute('class', 'floor'); plane.setAttribute('rotation', '-90 0 0');
            plane.setAttribute('width', Math.max(size.x, 0.1)); plane.setAttribute('height', Math.max(size.z, 0.1));
            plane.setAttribute('position', `${center.x} ${box.min.y + 0.02} ${center.z}`);
            plane.setAttribute('visible', 'false'); plane.setAttribute('data-floor-name', name);
            floorContainer.appendChild(plane);
          });
 
          if (!foundAny) {
            const box = new THREE.Box3().setFromObject(root);
            if (!box.isEmpty()) {
              const size = new THREE.Vector3(); const center = new THREE.Vector3();
              box.getSize(size); box.getCenter(center);
              const plane = document.createElement('a-plane');
              plane.setAttribute('class', 'floor');
              plane.setAttribute('rotation', '-90 0 0');
              plane.setAttribute('width', Math.max(size.x, 0.1));
              plane.setAttribute('height', Math.max(size.z, 0.1));
              plane.setAttribute('position', `${center.x} ${box.min.y + 0.02} ${center.z}`);
              plane.setAttribute('visible', 'false');
              plane.setAttribute('data-floor-name', 'fallback-' + this.el.id);
              floorContainer.appendChild(plane);
              if (DEBUG_LOG_MESH_NAMES) {
                console.log(this.el.id, ': no named floor matched — created fallback floor from bounding box.');
              }
            }
          }
        });
      }
    });
 
    /* ============================================================
       Component 3: tag-colliders
       -------------------------------------------------------------
       *** THIS IS THE MAIN FIX ***
       Previously, every mesh belonging to a .roompart entity got
       its own individual box collider (because the fallback rule
       set matches=true for ANY mesh inside a roompart, not just
       table/chair/door meshes). With a full room .glb this can
       easily produce hundreds or thousands of tiny box colliders
       per room — which is what made simple-collider's raycasting
       explode the moment you started moving.
 
       Fix: add a minimum bounding-box size filter (data.minSize).
       Meshes smaller than this in every dimension are skipped
       UNLESS they matched a real objectKey (table/chair/door),
       since those still need precise colliders. This keeps wall/
       structure colliders (which are large) while dropping tiny
       decorative/detail meshes (screws, trims, small props, etc.)
       that add collider count without adding meaningful collision
       value.
    ============================================================ */
    AFRAME.registerComponent('tag-colliders', {
      schema: {
        objectKeys: { default: ['table', 'chair', 'door'] },
        minSize: { default: 0.15 } // meters — skip fallback meshes smaller than this in all 3 dims
      },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh'); if (!root) return;
          root.updateMatrixWorld(true);
          const colliderContainer = document.createElement('a-entity');
          colliderContainer.setAttribute('id', 'static-colliders-' + (this.el.id || Math.random().toString(36).slice(2)));
          this.el.sceneEl.appendChild(colliderContainer);
 
          let builtCount = 0;
          let skippedSmall = 0;
 
          const addColliderForMesh = (mesh) => {
            const box = new THREE.Box3().setFromObject(mesh);
            if (box.isEmpty()) return;
            const size = new THREE.Vector3(); const center = new THREE.Vector3();
            box.getSize(size); box.getCenter(center);
            let horizontalExpand = 1.1;
            const verticalShrink = 0.92;
            const longRatioX = size.x / Math.max(size.z, 0.001);
            const longRatioZ = size.z / Math.max(size.x, 0.001);
            const smallThreshold = 0.4;
            if (longRatioX > 2 || longRatioZ > 2) {
              horizontalExpand = 1.02;
            } else if (size.x < smallThreshold && size.z < smallThreshold) {
              horizontalExpand = 1.2;
            } else if (size.x < smallThreshold || size.z < smallThreshold) {
              horizontalExpand = 1.15;
            }
            const isChairMesh = (node) => {
              let current = node;
              while (current) {
                if (current.name && /chair/i.test(current.name)) return true;
                current = current.parent;
              }
              return false;
            };
            const isChair = isChairMesh(mesh);
            const isChairFrame = mesh.name && /leg|support|spine|back|seat|backrest/i.test(mesh.name);
            if (isChair) {
              horizontalExpand = Math.min(horizontalExpand, 0.92);
              size.y *= 0.95;
              if (size.x < 0.18 || size.z < 0.18) {
                horizontalExpand = Math.min(horizontalExpand, 0.88);
              }
            }
            if (isChairFrame) {
              horizontalExpand = Math.min(horizontalExpand, 0.95);
            }
            size.x *= horizontalExpand;
            size.z *= horizontalExpand;
            size.y *= verticalShrink;
            const quat = mesh.getWorldQuaternion(new THREE.Quaternion());
            const euler = new THREE.Euler().setFromQuaternion(quat, 'YXZ');
            const collider = document.createElement('a-entity');
            collider.setAttribute('class', 'static-collider');
            collider.setAttribute('geometry', `primitive: box; width: ${Math.max(size.x, 0.01)}; height: ${Math.max(size.y, 0.01)}; depth: ${Math.max(size.z, 0.01)}`);
            collider.setAttribute('position', `${center.x} ${center.y} ${center.z}`);
            collider.setAttribute('rotation', `${THREE.MathUtils.radToDeg(euler.x)} ${THREE.MathUtils.radToDeg(euler.y)} ${THREE.MathUtils.radToDeg(euler.z)}`);
            collider.setAttribute('visible', 'false');
            colliderContainer.appendChild(collider);
            builtCount++;
          };
 
          root.traverse(node => {
            if (!node.isMesh) return;
            let current = node;
            let matches = false;
            while (current) {
              if (current.name && this.data.objectKeys.some(key => current.name.toLowerCase().includes(key))) {
                matches = true;
                break;
              }
              current = current.parent;
            }
 
            const isKeyMatch = matches;
 
            if (!matches && (this.el.classList.contains('roompart') || this.el.classList.contains('door'))) {
              matches = true;
            }
 
            if (matches) {
              // Only key-matched meshes (table/chair/door) always get a collider.
              // Fallback (room-shell) meshes get filtered by size to avoid
              // generating a collider per tiny detail mesh.
              if (!isKeyMatch) {
                const box = new THREE.Box3().setFromObject(node);
                if (!box.isEmpty()) {
                  const size = new THREE.Vector3();
                  box.getSize(size);
                  if (size.x < this.data.minSize && size.y < this.data.minSize && size.z < this.data.minSize) {
                    skippedSmall++;
                    return;
                  }
                }
              }
              addColliderForMesh(node);
            }
          });
 
          if (DEBUG_LOG_MESH_NAMES) {
            console.log(`[tag-colliders] ${this.el.id}: built ${builtCount} colliders, skipped ${skippedSmall} small meshes`);
          }
        });
      }
    });
 
    /* ============================================================
       Component 4: simple-collider (player movement collision)
       -------------------------------------------------------------
       *** SECOND FIX: broad-phase distance filter ***
       Even after trimming collider count in tag-colliders, raycasting
       against every remaining .static-collider / .item every frame is
       still wasteful once you have several rooms loaded. Before doing
       the expensive raycasts, we now do a cheap distance check against
       each collider's precomputed bounding-sphere center and only keep
       the ones within `cullRadius` of the player. This turns "raycast
       against everything" into "raycast against the handful of things
       actually nearby".
    ============================================================ */
    AFRAME.registerComponent('simple-collider', {
      schema: {
        objects: { default: '.item, .static-collider' },
        radius: { default: 0.4 },
        cullRadius: { default: 5 } // meters — only consider colliders within this range
      },
      init: function () {
        this.raycaster = new THREE.Raycaster();
        this.prevWorldPos = new THREE.Vector3();
        this.prevLocalPos = new THREE.Vector3();
        this.dir = new THREE.Vector3();
        this.side = new THREE.Vector3();
        this.meshCache = [];
        this.tmpSphereCenter = new THREE.Vector3();
 
        this.refreshMeshCache();
        this.cacheInterval = setInterval(() => this.refreshMeshCache(), 1000);
 
        setTimeout(() => {
          this.el.object3D.getWorldPosition(this.prevWorldPos);
          this.prevLocalPos.copy(this.el.object3D.position);
        }, 200);
      },
      refreshMeshCache: function () {
        const meshes = [];
        const els = this.el.sceneEl.querySelectorAll(this.data.objects);
        els.forEach(el => {
          const root = el.getObject3D('mesh');
          if (!root) return;
          root.updateMatrixWorld(true);
          root.traverse(node => {
            if (node.isMesh) {
              node.userData.__colliderOwnerEl = el;
              // Precompute a cheap bounding sphere in world space once,
              // so the per-frame broad-phase check is just a distance test.
              if (!node.geometry.boundingSphere) node.geometry.computeBoundingSphere();
              const sphere = node.geometry.boundingSphere.clone();
              sphere.applyMatrix4(node.matrixWorld);
              node.userData.__worldSphere = sphere;
              meshes.push(node);
            }
          });
        });
        this.meshCache = meshes;
        if (DEBUG_LOG_MESH_NAMES) {
          console.log('[simple-collider] active collider mesh count:', meshes.length);
        }
      },
      tick: function () {
        const currentWorldPos = new THREE.Vector3();
        this.el.object3D.getWorldPosition(currentWorldPos);
        this.dir.subVectors(currentWorldPos, this.prevWorldPos);
        const dist = this.dir.length();
        if (dist < 0.001) return;
        this.dir.normalize();
 
        const heldItem = this.el.sceneEl.heldItem;
        const heldEl = heldItem ? heldItem.el : null;
 
        // Broad phase: cheap distance filter before any raycasting.
        const cull = this.data.cullRadius;
        const nearbyMeshes = this.meshCache.filter(m => {
          if (heldEl && m.userData.__colliderOwnerEl === heldEl) return false;
          const sphere = m.userData.__worldSphere;
          if (!sphere) return true; // safety fallback, shouldn't normally happen
          return sphere.center.distanceToSquared(currentWorldPos) <= (cull + sphere.radius) * (cull + sphere.radius);
        });
 
        if (!nearbyMeshes.length) {
          this.prevWorldPos.copy(currentWorldPos);
          this.prevLocalPos.copy(this.el.object3D.position);
          return;
        }
 
        this.side.set(-this.dir.z, 0, this.dir.x);
        const r = this.data.radius;
        const heights = [0.4, 0.8, 1.2];
        const lateralOffsets = [0, -r * 0.5, r * 0.5];
 
        let hit = false;
        outer:
        for (let h of heights) {
          for (let off of lateralOffsets) {
            const origin = this.prevWorldPos.clone();
            origin.y = this.prevWorldPos.y - 1.1 + h;
            origin.addScaledVector(this.side, off);
            this.raycaster.set(origin, this.dir);
            this.raycaster.far = dist + r;
            const intersects = this.raycaster.intersectObjects(nearbyMeshes, true);
            if (intersects.length > 0 && intersects[0].distance <= dist + r) {
              hit = true;
              break outer;
            }
          }
        }
 
        if (hit) {
          this.el.object3D.position.copy(this.prevLocalPos);
        } else {
          this.prevWorldPos.copy(currentWorldPos);
          this.prevLocalPos.copy(this.el.object3D.position);
        }
      },
      remove: function () {
        if (this.cacheInterval) clearInterval(this.cacheInterval);
      }
    });
 
    /* ============================================================
       Component 5: head-bob
    ============================================================ */
    AFRAME.registerComponent('head-bob', {
      schema: { amount: { default: 0.03 }, speed: { default: 12 } },
      init: function () {
        this.baseY = this.el.object3D.position.y; this.time = 0;
        this.prevPos = new THREE.Vector3(); this.el.object3D.getWorldPosition(this.prevPos);
      },
      tick: function (t, dt) {
        let currentPos = new THREE.Vector3(); this.el.object3D.getWorldPosition(currentPos);
        let dx = currentPos.x - this.prevPos.x; let dz = currentPos.z - this.prevPos.z; let dist = Math.sqrt(dx*dx + dz*dz);
        if (dist > 0.001 && dist < 0.5) {
          this.time += dt * 0.001 * this.data.speed;
          this.el.object3D.position.y = this.baseY + Math.sin(this.time) * this.data.amount;
        } else {
          this.el.object3D.position.y = THREE.MathUtils.lerp(this.el.object3D.position.y, this.baseY, 0.1);
        }
        this.prevPos.copy(currentPos);
      }
    });
 
    /* ============================================================
       Component 6: grabbable
    ============================================================ */
    AFRAME.registerComponent('grabbable', {
      init: function () {
        this.isGrabbed = false;
        this.cam = document.querySelector('#cam');
        this.dropRay = new THREE.Raycaster();
        this.dropRay.far = 4;
 
        this.el.addEventListener('mousedown', () => {
          const scene = this.el.sceneEl;
 
          if (!this.isGrabbed) {
            if (scene.heldItem && scene.heldItem !== this) return;
 
            this.isGrabbed = true;
            scene.heldItem = this;
            this.cam.object3D.attach(this.el.object3D);
            this.el.object3D.position.set(0, -0.3, -1);
          } else {
            this.isGrabbed = false;
            scene.heldItem = null;
 
            const worldPos = new THREE.Vector3();
            this.el.object3D.getWorldPosition(worldPos);
 
            this.el.sceneEl.object3D.attach(this.el.object3D);
 
            const colliders = [];
            Array.from(this.el.sceneEl.querySelectorAll('.roompart, .item')).forEach(el => {
              if (el === this.el) return;
              const mesh = el.getObject3D('mesh');
              if (!mesh) return;
              mesh.updateMatrixWorld(true);
              mesh.traverse(node => {
                if (node.isMesh) colliders.push(node);
              });
            });
 
            if (colliders.length) {
              this.dropRay.set(
                new THREE.Vector3(worldPos.x, worldPos.y + 1, worldPos.z),
                new THREE.Vector3(0, -1, 0)
              );
              const hit = this.dropRay.intersectObjects(colliders, true)[0];
              if (hit) {
                this.el.object3D.position.y = hit.point.y + 0.03;
              }
            }
          }
        });
      }
    });
 
    /* ============================================================
       Component 7: open-door
    ============================================================ */
    AFRAME.registerComponent('open-door', {
      schema: { openAngle: { default: 90 }, speed: { default: 800 } },
      init: function () {
        this.isOpen = false;
        const rot = this.el.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        this.closedY = rot.y || 0;
        this.el.addEventListener('mousedown', () => {
          this.isOpen = !this.isOpen;
          const targetY = this.isOpen ? this.closedY + this.data.openAngle : this.closedY;
          this.el.setAttribute('animation__door', {
            property: 'rotation.y',
            to: targetY,
            dur: this.data.speed,
            easing: 'easeInOutQuad'
          });
        });
      }
    });
 
  </script>
 
  <a-scene
    fog="type: exponential; color: #050805; density: 0.04"
    background="color: #020202"
    shadow="type: pcfsoft"
    renderer="colorManagement: true; physicallyCorrectLights: true;">
    <a-assets>
      <a-asset-item id="bantho-model" src="bantho.glb"></a-asset-item>
      <a-asset-item id="bedroom-model" src="bedroomasset.glb"></a-asset-item>
      <a-asset-item id="kitchen-model" src="kitchenasset.glb"></a-asset-item>
      <a-asset-item id="living-model" src="livingasset.glb"></a-asset-item>
      <a-asset-item id="toilet-model" src="toiletasset.glb"></a-asset-item>
      <a-asset-item id="wallandground-model" src="wallandground.glb"></a-asset-item>
 
      <a-asset-item id="cua-model" src="cua.glb"></a-asset-item>
      <a-asset-item id="teddy-model" src="teddy.glb"></a-asset-item>
      <a-asset-item id="hairpin-model" src="hairpin.glb"></a-asset-item>
    </a-assets>
 
    <!-- ============== LIGHTING ============== -->
    <a-light type="ambient" color="#1c261c" intensity="0.45"></a-light>
    <a-entity light="type: point; color: #7cb860; intensity: 8; distance: 12; decay: 2; castShadow: true" position="-3.5 2.6 -1" flicker="min: 6.5; max: 8.5; speed: 0.3"></a-entity>
    <a-entity light="type: point; color: #ffdb59; intensity: 10; distance: 15; decay: 2; castShadow: true" position="2.5 2.6 1.5" flicker="min: 8.5; max: 10.5; speed: 0.2"></a-entity>
 
    <!-- ============== ROOM: 6 SPLIT PIECES ============== -->
    <a-entity id="wallandground" class="roompart" gltf-model="#wallandground-model" position="0 0 0" tag-floors tag-colliders></a-entity>
    <a-entity id="living" class="roompart" gltf-model="#living-model" position="0 0 0" tag-floors tag-colliders></a-entity>
    <a-entity id="kitchen" class="roompart" gltf-model="#kitchen-model" position="0 0 0" tag-floors tag-colliders></a-entity>
    <a-entity id="bedroom" class="roompart" gltf-model="#bedroom-model" position="0 0 0" tag-floors tag-colliders></a-entity>
    <a-entity id="toilet" class="roompart" gltf-model="#toilet-model" position="0 0 0" tag-floors tag-colliders></a-entity>
    <a-entity id="bantho" class="roompart" gltf-model="#bantho-model" position="0 0 0" tag-floors tag-colliders></a-entity>
 
    <!-- ============== INTERACTIVE OBJECTS ============== -->
    <a-entity class="item door" gltf-model="#cua-model" position="0 0 0" tag-colliders open-door="openAngle: 90; speed: 800"></a-entity>
 
    <a-entity gltf-model="#teddy-model" position="1 0.6 -2" class="item" grabbable
              animation__hoverin="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200"
              animation__hoverout="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
    </a-entity>
 
    <a-entity gltf-model="#hairpin-model" position="1.5 0.6 -2" class="item" grabbable
              animation__hoverin="property: scale; to: 1.2 1.2 1.2; startEvents: mouseenter; dur: 200"
              animation__hoverout="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
    </a-entity>
 
    <!-- ============== PLAYER RIG ============== -->
    <a-entity id="rig" position="1 0 0.5">
      <a-entity id="cam"
                camera="near: 0.01; fov: 60"
                position="0 1.1 0"
                look-controls
                movement-controls="speed: 0.15; controls: gamepad, keyboard, touch; fly: false"
                simple-collider="objects: .item, .static-collider; radius: 0.4; cullRadius: 5"
                head-bob="amount: 0.035; speed: 14">
 
                <a-cursor color="#ffffff" scale="0.7 0.7 0.7"
                          cursor="rayOrigin: mouse; fuse: false"
                          raycaster="objects: .door, .item; far: 6">
                </a-cursor>
      </a-entity>
 
      <a-entity hand-controls="hand: right"
                teleport-controls="cameraRig: #rig; teleportOrigin: #cam; button: trigger; collisionEntities: .floor; startEvents: triggerdown; endEvents: triggerup">
      </a-entity>
 
      <a-entity hand-controls="hand: left"
                raycaster="objects: .door, .item; far: 6; showLine: true; lineColor: #9fe0ff; lineOpacity: 0.5"
                cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup">
      </a-entity>
    </a-entity>
 
  </a-scene>
 
</body>
</html>
